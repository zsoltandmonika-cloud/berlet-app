<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 620" role="img" aria-labelledby="title desc">
<title id="title">Nutri Buddy, a 3D hatású mókuska</title>
<desc id="desc">Kedves csíkos chipmunk, fénylő kék szemekkel, puha bundával, bolyhos farokkal és kis cappuccino csészével.</desc>
<defs>
 <radialGradient id="fur" cx="35%" cy="22%" r="79%">
  <stop offset="0" stop-color="#fff1cc"/><stop offset=".2" stop-color="#e9b37d"/><stop offset=".49" stop-color="#c77e4f"/><stop offset=".8" stop-color="#995438"/><stop offset="1" stop-color="#713f30"/>
 </radialGradient>
 <radialGradient id="face" cx="44%" cy="28%" r="80%">
  <stop offset="0" stop-color="#fff9dd"/><stop offset=".4" stop-color="#ffe2b3"/><stop offset=".73" stop-color="#eab988"/><stop offset="1" stop-color="#b57453"/>
 </radialGradient>
 <radialGradient id="eye" cx="36%" cy="24%" r="74%">
  <stop offset="0" stop-color="#57d4ff"/><stop offset=".29" stop-color="#2f89d2"/><stop offset=".6" stop-color="#103c80"/><stop offset="1" stop-color="#081b3c"/>
 </radialGradient>
 <radialGradient id="pink" cx="50%" cy="50%" r="52%">
  <stop offset="0" stop-color="#ffa4b5" stop-opacity=".85"/><stop offset="1" stop-color="#ff7488" stop-opacity="0"/>
 </radialGradient>
 <linearGradient id="tail" x1="0" x2=".7" y1="0" y2="1">
  <stop offset="0" stop-color="#fff0cf"/><stop offset=".33" stop-color="#ad6b43"/><stop offset=".68" stop-color="#6f453a"/><stop offset="1" stop-color="#452e39"/>
 </linearGradient>
 <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#265b9d"/><stop offset=".5" stop-color="#102a59"/><stop offset="1" stop-color="#090f30"/>
 </linearGradient>
 <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#f2fbff"/><stop offset=".5" stop-color="#96d6f6"/><stop offset="1" stop-color="#3e79aa"/>
 </linearGradient>
 <filter id="deep" x="-38%" y="-40%" width="180%" height="190%">
  <feDropShadow dx="0" dy="15" stdDeviation="17" flood-color="#000918" flood-opacity=".64"/>
 </filter>
 <filter id="soft" x="-20%" y="-25%" width="145%" height="160%">
