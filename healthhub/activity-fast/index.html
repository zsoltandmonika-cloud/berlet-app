<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071a36">
<meta name="robots" content="noindex,nofollow">
<title>SHO · Aktivitás · gyorsindítás teszt</title>
<!-- Match the canonical HealthHub origin/path for assets, IndexedDB and Dropbox session.
     This page is an isolated opt-in preview; SHO and HealthHub links are unchanged. -->
<base href="/berlet-app/healthhub/">
<link rel="icon" href="./assets/icons/favicon-v146.ico">
<style>
 html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#071a36;color:#e8f5ff}
 #hhFastBoot{min-height:100dvh;display:grid;place-items:center;padding:24px;text-align:center;box-sizing:border-box}
 #hhFastBoot b{display:block;font-size:22px;margin-bottom:10px}
 #hhFastBoot span{font-size:13px;opacity:.8}
 #hhFastBoot a{color:#96d4ff;display:block;margin-top:18px}
 #hhFastBoot[hidden]{display:none!important}
</style>
<!-- Reuse the actual SHO Golden Standard CSS; no duplicate design implementation. -->
<link rel="stylesheet" href="/berlet-app/sh9/shared/sh9-golden-controls-v1.css?v=934-activity-fast">
<!-- Load the existing canonical Activity render/data modules only. -->
<script defer src="./activity-fast/vault-read-v3.js?v=3-no-startup-sync"></script>
<script defer src="./activity-fast/single-profile-cloud-v3.js?v=3-active-profile"></script>
<!-- No automatic HealthHub-wide cloud sync in this isolated Activity route. -->
<script defer src="./live-v369-distance.js?v=369"></script>
<script defer src="./live-v371-samsung.js?v=387"></script>
<script defer src="./live-v375-activity-timeline.js?v=376"></script>
<script defer src="./activity-fast/activity-engine-v3.js?v=3-profile-only-cache"></script>
<script defer src="./live-v373-samsung-import.js?v=373"></script>
<script defer src="./live-v363.js?v=624"></script>
<script defer src="./activity-premium-glass-v533.js?v=5335"></script>
<script defer src="./hc-wear-history-v1150.js?v=1153"></script>
<script defer src="/berlet-app/sh9/shared/sh9-golden-controls-v1.js?v=934-activity-fast-host"></script>
</head>
<body>
<div id="hhFastBoot" role="status">
 <div><b>🏃 SHO · Aktivitás</b><span>Gyorsindítás · meglévő Health Connect adatok</span><a href="/berlet-app/healthhub/">Vissza a HealthHubhoz</a></div>
</div>
<script>
(function(){
 'use strict';
 var started=performance.now();
 function home(){location.assign('/berlet-app/healthhub/')}

 var diagTag=document.createElement('aside');
 diagTag.id='hhActivityFastDiagnosticsV3';
 diagTag.setAttribute('role','status');
 diagTag.style.cssText='position:fixed;top:7px;right:7px;z-index:9800;width:fit-content;max-width:calc(100vw - 14px);background:rgba(9,37,71,.96);border:1px solid #83cefc;border-radius:12px;padding:7px 10px;box-shadow:0 5px 15px #0005;color:#dff7ff;font:700 10px/1.5 system-ui;pointer-events:none';
 function diagRefresh(){
  var d=window.hhActivityFastDiag||{};
  var profile=(d.profile||(localStorage.getItem('hh-profile')==='m'?'monika':'zsolt'))==='monika'?'Mónika':'Zsolt';
  var fmt=function(n){return Number.isFinite(n)?(n/1000).toFixed(1)+'s':'…'};
  var painted=window.hhActivityFastFirstPaintMs;
  var origin=d.firstSource==='local-snapshot'?'helyi profilcache':d.firstSource==='existing-local'?'helyi import':d.firstSource==='cloud'?'Dropbox':d.firstSource==='no-cloud'?'nincs felhőadat':'mérés folyamatban';
  diagTag.textContent=profile+' | Adatok: '+fmt(painted)+' | helyi: '+fmt(d.localMs)+' ('+(d.localMode||'…')+') | Dropbox: '+fmt(d.cloudMs)+' / '+(d.cloudStatus||'…')+' | '+origin;
 }
 window.hhActivityFastDiagnosticRefresh=diagRefresh;
 if(new URLSearchParams(location.search).get('diag')==='1'){
  document.body.appendChild(diagTag);
  diagRefresh();
  var diagTimer=setInterval(diagRefresh,700);
  setTimeout(function(){clearInterval(diagTimer);diagRefresh()},65000);
 }
 // Forward the Golden profile switch to Activity's real profile controller.
 // The standalone page intentionally doesn't load the whole HealthHub state manager.
 window.hhToggleProfileOneClick=function(){
  if(typeof window.hh191ToggleProfile==='function'){
   window.hh191ToggleProfile();
   window.setTimeout(function(){window.SH9_GOLDEN_CONTROLS_V1?.paint?.()},50);
  }
 };
 function paintNavLabels(){
  var page=document.getElementById('hhActivityPage191'),nav=page?.querySelector('.a191Nav');
  if(!nav)return;
  var en=localStorage.getItem('sh9-language-v1')==='en';
  var labels=en?['Home','Health','Activity','Records','Medications','More']:['Kezdőlap','Egészség','Aktivitás','Leletek','Gyógyszerek','Továbbiak'];
  nav.querySelectorAll('button').forEach(function(button,i){
   var b=button.querySelector('b');
   if(b&&labels[i]&&b.textContent!==labels[i])b.textContent=labels[i];
  });
 }
 var navLabelObserver;
 function initLabels(){
  var page=document.getElementById('hhActivityPage191');
  if(!page||navLabelObserver)return;
  paintNavLabels();
  navLabelObserver=new MutationObserver(paintNavLabels);
  navLabelObserver.observe(page,{childList:true,subtree:true});
 }
 window.addEventListener('sh9:languagechange',paintNavLabels);
 window.addEventListener('healthhub:profile-changed',function(){
  window.setTimeout(function(){paintNavLabels();window.SH9_GOLDEN_CONTROLS_V1?.paint?.()},50);
 });
 function complete(){
  var boot=document.getElementById('hhFastBoot');
  if(typeof window.hhOpenActivity!=='function'){
   if(boot)boot.innerHTML='<div><b>Az Aktivitás nem indítható</b><span>A teljes HealthHub továbbra is elérhető.</span><a href="/berlet-app/healthhub/">HealthHub megnyitása</a></div>';
   return;
  }
  // The native Activity navigation targets depend on Home-only controllers;
  // never leave a blank standalone screen after a navigation tap.
  window.show=home;
  window.hh191Go=home;
  window.hh191Quick=home;
  window.hh191Settings=home;
  try{
   window.hhOpenActivity();
   initLabels();
   if(boot)boot.hidden=true;
  }catch(error){
   console.error('SHO Activity fast preview launch',error);
   if(boot)boot.innerHTML='<div><b>Indítási hiba</b><span>A HealthHubban az eredeti Aktivitás tovább működik.</span><a href="/berlet-app/healthhub/">HealthHub megnyitása</a></div>';
   return;
  }
  // Diagnostic only: no health values are recorded or transmitted.
  var done=false,observer=new MutationObserver(function(){
   if(done)return;
   var pane=document.getElementById('hhActivityPage191');
   if(!pane||!pane.querySelector('.a191Top'))return;
   done=true;observer.disconnect();
   var ms=Math.round(performance.now()-started);
   document.documentElement.dataset.hhActivityFastFirstPaintMs=String(ms);
   console.info('SHO Activity fast preview first data paint:',ms,'ms');
   window.hhActivityFastFirstPaintMs=ms;
   if(window.hhActivityFastDiagnosticRefresh)window.hhActivityFastDiagnosticRefresh();
  });
  observer.observe(document.getElementById('hhActivityPage191')||document.body,{childList:true,subtree:true});
  setTimeout(function(){observer.disconnect()},60000);
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',complete,{once:true});
 else complete();
})();
</script>
</body>
</html>
