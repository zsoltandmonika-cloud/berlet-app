<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>HealthHub · ChatGPT Dropbox hitelesítés</title>
<style>body{background:#0b1729;color:#e8f4ff;font:16px system-ui;padding:24px;max-width:620px;margin:8vh auto}
main{background:#102a42;border:1px solid #6582a4;border-radius:18px;padding:22px}
a{color:#8cc9ff}h1{font-size:21px}</style></head>
<body><main><h1>🔐 HealthHub · ChatGPT-cél Dropbox</h1>
<p id="status" role="status">Dropbox hitelesítés ellenőrzése…</p>
<p><a href="./index.html?hhservice=1">Vissza a Léna Service Portalhoz</a></p>
<p><a href="./usage-control/index.html">📊 Vissza a Usage Control Centerhez</a></p>
</main><script src="./hh-chatgpt-target-auth-v739.js?v=739-account-871"></script>
<script>
(async function(){
 const status=document.getElementById('status');
 // Dedicated migration OAuth state. Keep the existing ChatGPT Analytics grant untouched.
 if(new URL(location.href).searchParams.get('state')?.startsWith('hhmigration_')){
  try{
   const script=document.createElement('script');
   script.src='./dropbox-migration-v1.js?v=1';
   await new Promise((ok,no)=>{script.onload=ok;script.onerror=()=>no(Error('Migrációs OAuth modul nem érhető el'));document.head.append(script)});
   const result=await window.HH_DROPBOX_MIGRATION_V1.exchangeCallback(location.href);
   status.textContent='✓ Az Outlook migrációs Dropbox engedélyezve. Ellenőrző végződés: '+result.suffix+
    '. Az adatok még nincsenek átírva. Nyisd meg a migrációs ellenőrzést.';
   const link=document.createElement('a');link.href='./dropbox-migration.html';link.textContent='Vissza a biztonságos Dropbox migrációhoz';
   status.after(link);
  }catch(e){status.textContent='⚠ Migrációs engedélyezési hiba: '+String(e.message||e)}
  return;
 }
 try{
  const result=await window.HH_CHATGPT_TARGET_AUTH_V739.exchange(location.href);
  status.textContent='✓ A cél Dropbox engedélyezve. Azonosító vége: '+result.accountSuffix+
   '. Nyisd meg a Vissza a Léna Service Portalhoz hivatkozást ugyanebben a böngészőben.';
 }catch(e){status.textContent='⚠ '+String(e.message||e)+
  ' Kérlek a HealthHub Admin felületen kezdd újra a csatlakoztatást.';}
})();
</script></body></html>
