<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dfeaf2">
<title>HealthHub – Pixel Baseline</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#dfeaf2;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{display:flex;justify-content:center}
.stage{position:relative;width:min(100vw,540px);min-height:100vh;background:#dfeaf2;overflow-x:hidden}
.screen{display:none;position:relative;width:100%}
.screen.on{display:block}
.mock{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.hot{position:absolute;border:0;background:transparent;z-index:10;cursor:pointer}
/* Home hotspots, expressed as percentages of the approved mockup image */
#home .profile-hot{left:69%;top:4%;width:22%;height:9%}
#home .health-module-hot{left:4%;top:39%;width:47%;height:14%}
#home .nav-home{left:3%;bottom:0.8%;width:18%;height:8%}
#home .nav-health{left:62%;bottom:0.8%;width:22%;height:8%}
#home .nav-timeline{left:20%;bottom:0.8%;width:20%;height:8%}
#home .nav-ask{left:39%;bottom:0.8%;width:21%;height:8%}
#home .nav-more{left:84%;bottom:0.8%;width:14%;height:8%}
/* HealthRadar hotspots */
#health .profile-hot{left:11%;top:4%;width:43%;height:18%}
#health .ask-hot{left:7%;top:67%;width:87%;height:14%}
#health .nav-home{left:4%;bottom:0.7%;width:18%;height:8%}
#health .nav-health{left:22%;bottom:0.7%;width:22%;height:8%}
#health .nav-timeline{left:44%;bottom:0.7%;width:19%;height:8%}
#health .nav-insights{left:63%;bottom:0.7%;width:20%;height:8%}
#health .nav-more{left:83%;bottom:0.7%;width:15%;height:8%}
.overlay{position:fixed;inset:0;background:rgba(10,30,48,.44);display:none;align-items:flex-end;justify-content:center;z-index:100}
.overlay.on{display:flex}
.sheet{width:min(100vw,540px);background:#fff;border-radius:26px 26px 0 0;padding:12px 16px 22px;box-shadow:0 -16px 50px rgba(15,45,68,.22)}
.handle{width:46px;height:5px;border-radius:8px;background:#d6e0e6;margin:0 auto 14px}
.sheet h3{margin:0 0 10px;color:#17334e}
.choice{width:100%;display:flex;align-items:center;gap:12px;border:0;background:#f4f8fb;border-radius:18px;padding:9px;margin:8px 0;text-align:left;color:#17334e}
.choice img{width:60px;height:60px;border-radius:50%;object-fit:cover}
.choice b{font-size:17px;display:block}.choice small{color:#76899a}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#17334e;color:white;padding:10px 14px;border-radius:999px;z-index:120;transition:.2s;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(min-width:700px){body{padding:18px 0}.stage{border-radius:30px;box-shadow:0 25px 80px rgba(24,57,80,.25)}}
</style>
</head>
<body>
<div class="stage">
  <section id="home" class="screen on">
    <img id="homeImg" class="mock" alt="HealthHub Home">
    <button class="hot profile-hot" aria-label="Profilváltás" onclick="openProfiles()"></button>
    <button class="hot health-module-hot" aria-label="HealthRadar" onclick="showScreen('health')"></button>
    <button class="hot nav-home" aria-label="Kezdőlap" onclick="showScreen('home')"></button>
    <button class="hot nav-health" aria-label="HealthRadar" onclick="showScreen('health')"></button>
    <button class="hot nav-timeline" aria-label="Idővonal" onclick="notice('Timeline következik')"></button>
    <button class="hot nav-ask" aria-label="Ask Léna" onclick="notice('Ask Léna teljes képernyő következik')"></button>
    <button class="hot nav-more" aria-label="Továbbiak" onclick="notice('További modulok következnek')"></button>
  </section>

  <section id="health" class="screen">
    <img id="healthImg" class="mock" alt="HealthRadar">
    <button class="hot profile-hot" aria-label="Profilváltás" onclick="openProfiles()"></button>
    <button class="hot ask-hot" aria-label="Ask Léna" onclick="notice('Ask Léna teljes képernyő következik')"></button>
    <button class="hot nav-home" aria-label="Kezdőlap" onclick="showScreen('home')"></button>
    <button class="hot nav-health" aria-label="HealthRadar" onclick="showScreen('health')"></button>
    <button class="hot nav-timeline" aria-label="Idővonal" onclick="notice('Timeline következik')"></button>
    <button class="hot nav-insights" aria-label="Elemzések" onclick="notice('Elemzések következnek')"></button>
    <button class="hot nav-more" aria-label="Továbbiak" onclick="notice('További modulok következnek')"></button>
  </section>
</div>

let profile = localStorage.getItem('healthhub-profile') || 'z';

function applyProfile(){
  document.getElementById('homeImg').src = profile==='z' ? assets.home_z : assets.home_m;
  document.getElementById('healthImg').src = profile==='z' ? assets.health_z : assets.health_m;
}
function setProfile(p){
  profile=p;
  localStorage.setItem('healthhub-profile',p);
  applyProfile();
  closeProfiles();
}
function showScreen(id){
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  window.scrollTo(0,0);
}
function openProfiles(){document.getElementById('profileOverlay').classList.add('on')}
function closeProfiles(){document.getElementById('profileOverlay').classList.remove('on')}
let timer;
function notice(t){
  clearTimeout(timer);
  const el=document.getElementById('toast');
  el.textContent=t; el.classList.add('on');
  timer=setTimeout(()=>el.classList.remove('on'),1800);
}
applyProfile();
</script>
