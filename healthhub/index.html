<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#e8f1f6">
<title>HealthHub</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#dce8ef;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}
body{display:flex;justify-content:center}.app{width:min(100vw,560px);min-height:100vh;background:#dce8ef;overflow:hidden;position:relative}
.screen{display:none}.screen.on{display:block}.viewport{position:relative;width:100%;overflow:hidden}
.mock{position:absolute;top:0;height:auto;max-width:none;user-select:none;-webkit-user-drag:none}
.homevp{aspect-ratio:430/1050}.homevp .mock{width:305.12%}.homevp.z .mock{left:0}.homevp.m .mock{left:-100.2%}
.healthvp{aspect-ratio:656/1199}.healthvp .mock{width:200%}.healthvp.z .mock{left:0}.healthvp.m .mock{left:-100%}
.hot{position:absolute;border:0;background:transparent;z-index:5;cursor:pointer}
.home-profile{left:67%;top:4%;width:27%;height:10%}.home-health-card{left:3%;top:38%;width:48%;height:15%}
.home-nav-health{left:63%;bottom:1%;width:21%;height:8%}.home-nav-timeline{left:21%;bottom:1%;width:20%;height:8%}.home-nav-ask{left:41%;bottom:1%;width:20%;height:8%}
.health-profile{left:6%;top:4%;width:51%;height:20%}.health-ask{left:6%;top:67%;width:88%;height:14%}
.health-nav-home{left:3%;bottom:1%;width:18%;height:8%}.health-nav-timeline{left:44%;bottom:1%;width:20%;height:8%}.health-nav-insights{left:64%;bottom:1%;width:19%;height:8%}
.overlay{position:fixed;inset:0;background:#10263866;display:none;align-items:flex-end;justify-content:center;z-index:30}.overlay.on{display:flex}
.sheet{width:min(100vw,560px);background:white;border-radius:28px 28px 0 0;padding:12px 16px 22px;box-shadow:0 -15px 45px #17354d33}
.handle{width:48px;height:5px;background:#d8e1e7;border-radius:9px;margin:0 auto 14px}.sheet h3{margin:0 0 11px;color:#15344f}
.choice{width:100%;border:0;background:#f3f8fb;border-radius:18px;padding:14px;margin:8px 0;text-align:left;font-weight:800;font-size:17px;color:#17354d}
.choice small{display:block;color:#7b8e9d;font-weight:500;font-size:12px;margin-top:2px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,18px);opacity:0;background:#17354d;color:#fff;padding:10px 14px;border-radius:999px;z-index:50;transition:.2s;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(min-width:720px){body{padding:18px}.app{border-radius:34px;box-shadow:0 26px 80px #183d5529}}
</style></head>
<body><div class="app">
<section id="home" class="screen on"><div id="homevp" class="viewport homevp z"><img class="mock" src="data:application/vnd.openai.code-mode-image;base64,HKCaKSPCSnSfJ5ac/Zogbg==" alt="HealthHub Home">
<button class="hot home-profile" onclick="openProfiles()" aria-label="Profilváltás"></button>
<button class="hot home-health-card" onclick="show('health')" aria-label="HealthRadar"></button>
<button class="hot home-nav-health" onclick="show('health')" aria-label="HealthRadar"></button>
<button class="hot home-nav-timeline" onclick="notice('Timeline következik')" aria-label="Timeline"></button>
<button class="hot home-nav-ask" onclick="notice('Ask Léna teljes képernyő következik')" aria-label="Ask Léna"></button>
</div></section>
<section id="health" class="screen"><div id="healthvp" class="viewport healthvp z"><img class="mock" src="data:application/vnd.openai.code-mode-image;base64,cIhEHYysRYCpLYFyV59LHg==" alt="HealthRadar">
<button class="hot health-profile" onclick="openProfiles()" aria-label="Profilváltás"></button>
<button class="hot health-ask" onclick="notice('Ask Léna teljes képernyő következik')" aria-label="Ask Léna"></button>
<button class="hot health-nav-home" onclick="show('home')" aria-label="Kezdőlap"></button>
<button class="hot health-nav-timeline" onclick="notice('Timeline következik')" aria-label="Timeline"></button>
<button class="hot health-nav-insights" onclick="notice('Elemzések következnek')" aria-label="Elemzések"></button>
</div></section>
</div>
<div id="ov" class="overlay" onclick="if(event.target.id==='ov')closeProfiles()"><div class="sheet"><div class="handle"></div><h3>Profilváltás</h3>
<button class="choice" onclick="setProfile('z')">Zsolt<small>HealthHub profil</small></button>
<button class="choice" onclick="setProfile('m')">Mónika<small>HealthHub profil</small></button>
</div></div><div id="toast" class="toast"></div>
<script>
let profile=localStorage.getItem('hh-pixel-profile')||'z';
function apply(){homevp.className='viewport homevp '+profile;healthvp.className='viewport healthvp '+profile}
function setProfile(p){profile=p;localStorage.setItem('hh-pixel-profile',p);apply();closeProfiles()}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');window.scrollTo(0,0)}
function openProfiles(){ov.classList.add('on')}function closeProfiles(){ov.classList.remove('on')}
let t;function notice(s){clearTimeout(t);toast.textContent=s;toast.classList.add('on');t=setTimeout(()=>toast.classList.remove('on'),1600)}
apply();
</script></body></html>
