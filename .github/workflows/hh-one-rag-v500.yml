name: HH One v500 RAG foundation QA

on:
  pull_request:
    paths:
      - "healthhub/hh-one-rag-v500.js"
      - "healthhub/index.html"
      - "healthhub/digital-health/index.html"
      - "healthhub/tests/hh-one-rag-v500.test.cjs"
      - ".github/workflows/hh-one-rag-v500.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rag-safety-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS syntax and RAG owner/freshness gates
        run: |
          node --check healthhub/hh-one-rag-v500.js
          node healthhub/tests/hh-one-rag-v500.test.cjs
      - name: Confirm no embedded cloud credentials
        run: |
          if grep -E 'ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' healthhub/hh-one-rag-v500.js; then
            echo "Secret-looking string detected"; exit 1;
          fi
