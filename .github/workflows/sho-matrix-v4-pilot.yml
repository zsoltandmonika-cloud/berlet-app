name: SHO Matrix Search V4 · Parallel Pilot QA
on:
  push:
    branches:
      - feature/sho-matrix-search-v4-pilot
    paths:
      - "sh9/super-search/matrix-v4/**"
      - "healthhub/tests/sho-matrix-search-v4-pilot.test.mjs"
      - ".github/workflows/sho-matrix-v4-pilot.yml"
  pull_request:
    paths:
      - "sh9/super-search/matrix-v4/**"
      - "healthhub/tests/sho-matrix-search-v4-pilot.test.mjs"
      - ".github/workflows/sho-matrix-v4-pilot.yml"
permissions:
  contents: read
jobs:
  matrix-core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Syntax check · Matrix core
        run: node --check sh9/super-search/matrix-v4/matrix-search-engine-v4.mjs
      - name: Strict JSON rules
        run: node -e 'const x=require("./sh9/super-search/matrix-v4/matrix-rules-v4.json"); if (x.schema!=="sho.matrix-rules/4") process.exit(1)'
      - name: 14 architecture, concurrency, timetable and old TripPack tests
        run: node --test healthhub/tests/sho-matrix-search-v4-pilot.test.mjs
