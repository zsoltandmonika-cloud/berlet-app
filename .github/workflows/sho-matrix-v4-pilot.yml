name: SHO Matrix Search V4 · Parallel Pilot QA
on:
  push:
    branches:
      - feature/sho-matrix-search-v4-pilot
    paths:
      - "sh9/super-search/matrix-v4/**"
      - "healthhub/tests/sho-matrix-search-v4-pilot.test.mjs"
      - "healthhub/tests/sho-matrix-source-adapters-v4.test.mjs"
      - "healthhub/tests/sho-matrix-live-pilot-v4.test.mjs"
      - ".github/workflows/sho-matrix-v4-pilot.yml"
  pull_request:
    paths:
      - "sh9/super-search/matrix-v4/**"
      - "healthhub/tests/sho-matrix-search-v4-pilot.test.mjs"
      - ".github/workflows/sho-matrix-v4-pilot.yml"
permissions:
  contents: read
jobs:
  matrix-core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Syntax check · Matrix core
        run: node --check sh9/super-search/matrix-v4/matrix-search-engine-v4.mjs
      - name: Syntax check · existing-source adapters
        run: node --check sh9/super-search/matrix-v4/matrix-existing-sources-v4.mjs
      - name: Syntax checks · real workers and live pilot
        run: |
          node --check sh9/super-search/matrix-v4/matrix-local-feed-reader-v4.mjs
          node --check sh9/super-search/matrix-v4/matrix-local-worker-v4.mjs
          node --check sh9/super-search/matrix-v4/matrix-worker-provider-v4.mjs
          node --check sh9/super-search/matrix-v4/matrix-live-pilot-v4.mjs
      - name: Strict JSON rules
        run: node -e 'const x=require("./sh9/super-search/matrix-v4/matrix-rules-v4.json"); if (x.schema!=="sho.matrix-rules/4") process.exit(1)'
      - name: Architecture, concurrency, source adapters and existing TripPack
        run: node --test healthhub/tests/sho-matrix-search-v4-pilot.test.mjs healthhub/tests/sho-matrix-source-adapters-v4.test.mjs healthhub/tests/sho-matrix-live-pilot-v4.test.mjs
