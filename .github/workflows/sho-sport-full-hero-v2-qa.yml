name: SHO Sport V2 · Full Hero and MeccsRadar Controls QA
on:
  push:
    branches:
      - fix/sho-sport-full-hero-menu-v2
    paths:
      - 'sh9/sport/**'
      - 'sh9/tests/sho-sport-central-v1.test.cjs'
      - '.github/workflows/sho-sport-full-hero-v2-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test full-size hero, slim glass menu, full-view placement and existing features
        run: node --test sh9/tests/sho-sport-central-v1.test.cjs sh9/tests/sho-icons-outline-only-v1161.test.cjs
      - name: Verify source media and no native changes
        run: |
          test -s sh9/sport/hero.webp
          file sh9/sport/hero.webp | grep -i WebP
          git fetch origin main --depth=1
          MODIFIED=$(git diff --name-only origin/main HEAD)
          if printf '%s\n' "$MODIFIED" | grep -E '(^healthhub/|^sh9/shared/|^sh9/smart-travel/|^sh9/family-hub/)'; then
            echo 'Golden modules touched unexpectedly'
            exit 1
          fi
