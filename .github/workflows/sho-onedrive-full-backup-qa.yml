name: SHO OneDrive Full Backup QA (no production access)
on:
  pull_request:
    paths:
      - 'ops/backup/**'
      - '.github/workflows/sho-onedrive-full-backup-*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse shell and test recovery manifest
        run: |
          bash -n ops/backup/nightly-full-backup.sh
          python -m unittest discover -s ops/backup/tests -v
