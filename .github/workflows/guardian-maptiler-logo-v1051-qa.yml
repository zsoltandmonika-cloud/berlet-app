name: Family Guard MapTiler logo glass v1051 QA
on:
  pull_request:
    paths:
      - 'healthhub/guardian/guardian-satellite-v1033.css'
      - 'healthhub/guardian/index.html'
      - 'healthhub/tests/guardian-maptiler-logo-v1051.test.cjs'
      - '.github/workflows/guardian-maptiler-logo-v1051-qa.yml'
  push:
    branches: [main]
    paths:
      - 'healthhub/guardian/guardian-satellite-v1033.css'
      - 'healthhub/guardian/index.html'
      - 'healthhub/tests/guardian-maptiler-logo-v1051.test.cjs'
      - '.github/workflows/guardian-maptiler-logo-v1051-qa.yml'
jobs:
  logo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate preserved MapTiler attribution and softened glass style
        run: node --test healthhub/tests/guardian-maptiler-logo-v1051.test.cjs
