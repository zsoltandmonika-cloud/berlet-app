name: HH Activity + Sleep · logged Health Connect wearable data v1150 QA
on:
  push:
    branches:
      - feature/hc-wear-history-activity-sleep-20261103
      - fix/sleep-extra-above-lena-v1151-20261103
      - fix/paired-sleep-v1152
      - fix/sleep-eight-cards-v1153
    paths:
      - 'healthhub/hc-wear-history-v1150.js'
      - 'healthhub/index.html'
      - 'healthhub/tests/hc-wear-history-v1150.test.cjs'
      - '.github/workflows/hh-activity-sleep-wear-history-v1150-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hh-wear-history-v1150-qa
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JS syntax (no native/watch APK)
        run: node --check healthhub/hc-wear-history-v1150.js
      - name: Existing six-card Sleep renderer regression
        run: node healthhub/tests/sleep-v432-factors.test.js
      - name: Test timestamp, data provenance, profile isolation and Activity/Sleep wiring
        run: node healthhub/tests/hc-wear-history-v1150.test.cjs
      - name: Confirm no watch files or Android native changes in feature diff
        run: |
          git fetch origin main --depth=1
          CHANGED=$(git diff --name-only origin/main HEAD)
          printf '%s\n' "$CHANGED"
          if printf '%s\n' "$CHANGED" | grep -E '(^healthhub/android-bridge/|^sh9/|^supabase/|^healthhub/live-v170.js|^healthhub/live-v184.js)'; then
            echo 'Production native or canonical module touched unexpectedly'
            exit 1
          fi
