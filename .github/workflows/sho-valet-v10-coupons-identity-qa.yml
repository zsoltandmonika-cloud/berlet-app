name: SHO Smart Valet v10 · Coupons & ID categories QA
on:
  pull_request:
    paths:
      - 'sh9/wallet/**'
      - 'sh9/tests/sho-smart-valet-v10-coupons-identity.test.cjs'
      - 'sh9/tests/sho-smart-valet-loyalty-v9.test.cjs'
      - 'supabase/migrations/20261105164000_sho_valet_v10_coupons_only.sql'
      - '.github/workflows/sho-valet-v10-coupons-identity-qa.yml'
  push:
    branches: [main]
    paths:
      - 'sh9/wallet/**'
      - 'sh9/tests/sho-smart-valet-v10-coupons-identity.test.cjs'
      - 'sh9/tests/sho-smart-valet-loyalty-v9.test.cjs'
      - 'supabase/migrations/20261105164000_sho_valet_v10_coupons_only.sql'
permissions:
  contents: read
jobs:
  coupons-and-ids:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify syntax and protected identity/coupon gallery
        run: |
          node --check sh9/wallet/smart-valet-v1.js
          node --check sh9/wallet/smart-valet-private-v7.js
          node --test sh9/tests/sho-smart-valet-v10-coupons-identity.test.cjs
          node --test sh9/tests/sho-smart-valet-loyalty-v9.test.cjs
          node --test sh9/tests/sho-smart-valet-private-v7.test.cjs
          node --test sh9/tests/sho-smart-valet-bkk-nav-v5.test.cjs
          node --test sh9/tests/sho-smart-valet-travel-theme-v2.test.cjs
          node --test sh9/tests/sho-smart-valet-preview-v1.test.cjs
