name: HealthHub · Admin Mobile UX v748
on:
  pull_request:
    paths:
      - 'healthhub/hh-admin-mobile-focus-v748.js'
      - 'healthhub/hh-unified-admin-v745.js'
      - 'healthhub/device-registry-v401.js'
      - 'healthhub/live-v305.js'
      - 'healthhub/index.html'
      - 'healthhub/tests/hh-admin-mobile-v748.test.cjs'
      - '.github/workflows/hh-admin-mobile-v748-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-admin-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Admin JavaScript syntax
        run: |
          node --check healthhub/hh-admin-mobile-focus-v748.js
          node --check healthhub/hh-unified-admin-v745.js
          node --check healthhub/device-registry-v401.js
          node --check healthhub/live-v305.js
      - name: Mobile navigation / preservation tests
        run: |
          node --test healthhub/tests/hh-admin-mobile-v748.test.cjs
          node healthhub/tests/unified-admin-v745.test.cjs
          node healthhub/tests/hh-one-service-center-502.test.cjs
