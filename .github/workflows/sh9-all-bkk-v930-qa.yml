name: SH9 BKK all-vehicles v930 focused QA
on:
  pull_request:
    paths:
      - "healthhub/guardian/guardian-sh9-all-bkk-v928.*"
      - "healthhub/guardian/guardian-live-pilot-v793.js"
      - "healthhub/guardian/guardian-transit-v791.js"
      - "healthhub/guardian/index.html"
      - "healthhub/tests/sh9-bkk-all-v928.test.cjs"
      - "healthhub/tests/guardian-bkk-smart-delay-v1.test.cjs"
      - "supabase/functions/hh-bkk-live-v793-preview/index.ts"
      - ".github/workflows/sh9-all-bkk-v930-qa.yml"
  push:
    branches: ["main"]
    paths:
      - "healthhub/guardian/guardian-sh9-all-bkk-v928.*"
      - "healthhub/guardian/guardian-live-pilot-v793.js"
      - "healthhub/guardian/guardian-transit-v791.js"
      - "healthhub/guardian/index.html"
      - "healthhub/tests/sh9-bkk-all-v928.test.cjs"
      - "healthhub/tests/guardian-bkk-smart-delay-v1.test.cjs"
      - "supabase/functions/hh-bkk-live-v793-preview/index.ts"
      - ".github/workflows/sh9-all-bkk-v930-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-live-map:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check healthhub/guardian/guardian-sh9-all-bkk-v928.js
          node --check healthhub/guardian/guardian-live-pilot-v793.js
          node --check healthhub/guardian/guardian-transit-v791.js
      - name: Isolated all-BKK viewport and verified-marker regression
        run: node --test healthhub/tests/sh9-bkk-all-v928.test.cjs healthhub/tests/guardian-bkk-smart-delay-v1.test.cjs
