name: SHO v1160 · Subtle Coming Soon tiles QA
on:
  push:
    branches:
      - feat/sho-soft-unavailable-tiles-20261103
    paths:
      - 'sh9/index.html'
      - 'sh9/sho-preview/sho-wiring-v2.js'
      - 'sh9/tests/sho-soft-planned-v1160.test.cjs'
      - '.github/workflows/sho-planned-tiles-v1160-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS syntax
        run: node --check sh9/sho-preview/sho-wiring-v2.js
      - name: Test five placeholder statuses and Golden SHO navigation
        run: node --test sh9/tests/sho-soft-planned-v1160.test.cjs sh9/tests/sho-start-v27.test.cjs
      - name: Verify Golden Sleep and native HH One untouched
        run: |
          git fetch origin main --depth=1
          CHANGED=$(git diff --name-only origin/main HEAD)
          printf '%s\n' "$CHANGED"
          if printf '%s\n' "$CHANGED" | grep -E '(^healthhub/|^sh9/shared/|^healthhub/android-bridge/|^sh9/smart-travel/)'; then
            echo 'Golden Sleep, shared dock or production feature unexpectedly changed'
            exit 1
          fi
