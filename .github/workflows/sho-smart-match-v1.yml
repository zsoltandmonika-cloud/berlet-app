name: SHO Smart Match isolated QA
on:
  pull_request:
    paths:
      - "healthhub/guardian/smart-260-connect/**"
      - "sh9/smart-travel/public-transport/smart-trip/index.html"
      - ".github/workflows/sho-smart-match-v1.yml"
  push:
    branches:
      - "main"
      - "feature/guardian-smart-260-connect"
    paths:
      - "healthhub/guardian/smart-260-connect/**"
      - "sh9/smart-travel/public-transport/smart-trip/index.html"
      - ".github/workflows/sho-smart-match-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Node syntax check (pure browser-side modules)
        run: |
          node --version
          node --check healthhub/guardian/smart-260-connect/core.mjs
          node --check healthhub/guardian/smart-260-connect/app.mjs
          node --check healthhub/guardian/smart-260-connect/favorite-route-editor-v939.js
          node --check healthhub/guardian/smart-260-connect/fleet-catalog-v940.mjs
          node --check healthhub/guardian/smart-260-connect/smart-delay-client-v1.mjs
          node --check healthhub/guardian/bkk-smart-delay-v1.js
          node --check healthhub/guardian/bkk-live-map-v793.js
      - name: Shared BKK Smart Delay classification and exact-stop contract
        run: node --test healthhub/tests/guardian-bkk-smart-delay-v1.test.cjs
      - name: Read-only family favorites and preservation of legacy Smart Match routes
        run: node --test healthhub/tests/sho-smart-match-favorite-route-v939.test.cjs
      - name: Full-fleet editor, family directions and deletable template regression
        run: node --test healthhub/tests/sho-smart-match-fleet-v940.test.cjs
      - name: Scheduled matching, walking and safe-fail regression tests
        run: node --test healthhub/guardian/smart-260-connect/core.test.mjs
      - name: Official public BKK GTFS routing diagnostic
        run: node --test healthhub/guardian/smart-260-connect/real-feed.test.mjs
      - name: Validate isolated Smart Trip AI navigation
        run: |
          grep -q '/berlet-app/healthhub/guardian/smart-260-connect/' sh9/smart-travel/public-transport/smart-trip/index.html
          grep -q 'pinnedBanner' healthhub/guardian/smart-260-connect/index.html
          grep -q 'BKK Zrt.' healthhub/guardian/smart-260-connect/index.html
