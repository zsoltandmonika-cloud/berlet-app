name: SH9 Outlook Agenda QA
on:
  pull_request:
    paths:
      - 'sh9/index.html'
      - 'sh9/sh9-info-v6.js'
      - 'healthhub/tests/sh9-nameday-month-v9.test.cjs'
      - 'healthhub/tests/sh9-info-color-standard-v10.test.cjs'
      - 'sh9/outlook-agenda-*.js'
      - 'sh9/outlook-session-v2.js'
      - 'sh9/outlook-agenda-*.css'
      - 'sh9/outlook-agenda-README.md'
      - 'healthhub/tests/sh9-outlook-agenda.test.cjs'
      - 'healthhub/tests/sh9-outlook-persistent-v2.test.cjs'
      - '.github/workflows/sh9-outlook-agenda-qa.yml'
  push:
    branches: [main]
    paths:
      - 'sh9/index.html'
      - 'sh9/sh9-info-v6.js'
      - 'healthhub/tests/sh9-nameday-month-v9.test.cjs'
      - 'healthhub/tests/sh9-info-color-standard-v10.test.cjs'
      - 'sh9/outlook-agenda-*.js'
      - 'sh9/outlook-agenda-*.css'
      - 'healthhub/tests/sh9-outlook-agenda.test.cjs'
      - '.github/workflows/sh9-outlook-agenda-qa.yml'
permissions:
  contents: read
jobs:
  agenda-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check sh9/sh9-info-v6.js
          node --check sh9/outlook-agenda-v1.js
          node --check sh9/outlook-session-v2.js
          node --check sh9/outlook-agenda-model-v1.js
      - name: Offline synthetic Outlook QA
        run: |
          node --test healthhub/tests/sh9-outlook-agenda.test.cjs
          node --test healthhub/tests/sh9-outlook-persistent-v2.test.cjs
          node --test healthhub/tests/sh9-nameday-month-v9.test.cjs
          node --test healthhub/tests/sh9-info-color-standard-v10.test.cjs
