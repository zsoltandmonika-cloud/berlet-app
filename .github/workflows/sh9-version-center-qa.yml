name: SH9 · Central Version & Device Center QA
on:
  pull_request:
    paths:
      - "healthhub/sh9-version-model-v1.js"
      - "healthhub/sh9-version-center-v1.js"
      - "healthhub/hh-unified-admin-v745.js"
      - "healthhub/index.html"
      - "healthhub/tests/sh9-version-center.test.cjs"
      - "sh9/version.json"
      - ".github/workflows/sh9-version-center-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  version-and-device-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static syntax verification
        run: |
          node --check healthhub/sh9-version-model-v1.js
          node --check healthhub/sh9-version-center-v1.js
          node --check healthhub/hh-unified-admin-v745.js
      - name: Grounded version/OTA/paired-phone QA
        run: node --test healthhub/tests/sh9-version-center.test.cjs
      - name: Preserve existing HH One Service Center contract
        run: |
          node healthhub/tests/hh-one-service-center-502.test.cjs
          node healthhub/tests/hh-one-remote-v502.test.cjs
