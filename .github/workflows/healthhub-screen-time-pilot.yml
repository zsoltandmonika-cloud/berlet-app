name: HealthHub Screen Time PILOT · Isolated Android QA

on:
  pull_request:
    paths:
      - "healthhub/screen-time-pilot/**"
      - ".github/workflows/healthhub-screen-time-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot_build_test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: healthhub/screen-time-pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Pure Kotlin regression and isolated debug build
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK does not request INTERNET
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -F 'android.permission.INTERNET'; then
            echo "::error::PILOT APK must remain offline and request NO INTERNET"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -6
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='hu.zsoltmonika.healthhub.screentimepilot'"
      - uses: actions/upload-artifact@v4
        with:
          name: HH-Screen-Time-PILOT-v0.1.0-DEBUG-NOT-PRODUCTION
          path: healthhub/screen-time-pilot/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
