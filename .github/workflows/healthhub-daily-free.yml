name: HealthHub Daily Free

on:
  schedule:
    - cron: "17 4-8 * * *"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/healthhub-daily-free.yml"
      - "healthhub/scripts/generate_daily_free.py"
      - "healthhub/scripts/generate_daily_ai.py"
  workflow_dispatch:
    inputs:
      mode:
        description: "Generate content"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - spark
          - briefing

permissions:
  contents: write

concurrency:
  group: healthhub-daily-free
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate HealthHub daily content
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 healthhub/scripts/generate_daily_free.py "${{ inputs.mode }}"
          else
            python3 healthhub/scripts/generate_daily_free.py auto
          fi

      - name: Generate public AI versions of Spark and Headline
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HEALTHHUB_AI_MODEL: gpt-4.1-mini
        run: |
          python3 healthhub/scripts/generate_daily_ai.py auto

      - name: Validate JSON
        shell: bash
        run: |
          python3 -m json.tool healthhub/data/daily-spark.json >/dev/null
          python3 -m json.tool healthhub/data/daily-briefing.json >/dev/null

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "healthhub-free-bot"
          git config user.email "healthhub-free-bot@users.noreply.github.com"
          git add healthhub/data/daily-spark.json healthhub/data/daily-briefing.json
          if git diff --cached --quiet; then
            echo "No content changes."
            exit 0
          fi
          git commit -m "HealthHub daily free content"
          git pull --rebase origin main
          git push origin HEAD:main
