name: HealthHub v692 SHA-scoped original PDF QA
on:
  pull_request:
    paths:
      - 'healthhub/live-v201.js'
      - 'healthhub/index.html'
      - 'healthhub/tests/pdf-original-sha-v692.test.cjs'
      - 'healthhub/tests/pdf-viewer-v690.test.cjs'
      - 'healthhub/tests/pdf-device-audit-v691.test.cjs'
      - 'healthhub/tests/drive-v683-offline-oauth-staging.test.cjs'
      - '.github/workflows/healthhub-pdf-sha-v692-qa.yml'
  push:
    paths:
      - 'healthhub/live-v201.js'
      - 'healthhub/index.html'
      - 'healthhub/tests/pdf-original-sha-v692.test.cjs'
      - '.github/workflows/healthhub-pdf-sha-v692-qa.yml'
jobs:
  duplicate-tag-sha-resolution:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original PDF collision and privacy regression
        run: node --test healthhub/tests/pdf-original-sha-v692.test.cjs healthhub/tests/pdf-viewer-v690.test.cjs healthhub/tests/pdf-device-audit-v691.test.cjs healthhub/tests/drive-v683-offline-oauth-staging.test.cjs
