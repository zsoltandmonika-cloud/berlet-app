name: SH9 Smart Travel Golden QA
on:
  pull_request:
    paths:
      - 'sh9/smart-travel/**'
      - 'healthhub/tests/sh9-smart-travel-golden.test.cjs'
      - 'healthhub/tests/sh9-mav-smart-rail-v1.test.cjs'
      - 'healthhub/tests/sh9-mav-official-links-v1.test.cjs'
      - 'healthhub/tests/sh9-mav-journeys-v2.test.cjs'
      - 'healthhub/tests/sh9-mav-gtfs-core-v1.test.cjs'
      - 'healthhub/tests/sh9-mav-google-fallback-v1.test.cjs'
      - 'healthhub/tests/sh9-mav-calendar-native-v603.test.cjs'
      - 'healthhub/tests/sh9-mav-smart-route-v604.test.cjs'
      - 'healthhub/tests/sh9-mav-personal-v607.test.cjs'
      - 'healthhub/tests/test_sh9_mav_gtfs_import_v1.py'
      - '.github/workflows/sh9-smart-travel-v3-qa.yml'
  push:
    branches: [main]
    paths:
      - 'sh9/smart-travel/**'
      - 'healthhub/tests/sh9-smart-travel-golden.test.cjs'
      - 'healthhub/tests/sh9-mav-smart-rail-v1.test.cjs'
      - 'healthhub/tests/sh9-mav-official-links-v1.test.cjs'
      - 'healthhub/tests/sh9-mav-journeys-v2.test.cjs'
      - 'healthhub/tests/sh9-mav-gtfs-core-v1.test.cjs'
      - 'healthhub/tests/sh9-mav-google-fallback-v1.test.cjs'
      - 'healthhub/tests/sh9-mav-calendar-native-v603.test.cjs'
      - 'healthhub/tests/sh9-mav-smart-route-v604.test.cjs'
      - 'healthhub/tests/sh9-mav-personal-v607.test.cjs'
      - 'healthhub/tests/test_sh9_mav_gtfs_import_v1.py'
      - '.github/workflows/sh9-smart-travel-v3-qa.yml'
permissions:
  contents: read
jobs:
  golden-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check sh9/smart-travel/weather-v3.js
          node --check sh9/smart-travel/world-clocks-v2.js
          node --check sh9/smart-travel/public-transport/mav/rail-links-v1.js
          node --check sh9/smart-travel/public-transport/mav/rail-ui-v1.js
          node --check sh9/smart-travel/public-transport/mav/rail-official-v1.js
          node --check sh9/smart-travel/public-transport/mav/rail-journeys-v2.js
          node --check sh9/smart-travel/public-transport/mav/rail-gtfs-config-v1.js
          node --check sh9/smart-travel/public-transport/mav/rail-gtfs-core-v1.js
          node --check sh9/smart-travel/public-transport/mav/rail-gtfs-bridge-v1.js
          node --check sh9/smart-travel/public-transport/mav/rail-google-config-v1.js
          node --check sh9/smart-travel/public-transport/mav/rail-google-routes-v1.js
          node --check sh9/smart-travel/public-transport/mav/rail-google-bridge-v1.js
          node --check sh9/smart-travel/public-transport/mav/rail-personal-v607.js
          python3 -m py_compile sh9/smart-travel/public-transport/mav/gtfs/build_gtfs_snapshot.py
      - name: Run Smart Travel Golden Standard tests
        run: node --test healthhub/tests/sh9-smart-travel-golden.test.cjs healthhub/tests/sh9-mav-smart-rail-v1.test.cjs healthhub/tests/sh9-mav-official-links-v1.test.cjs healthhub/tests/sh9-mav-journeys-v2.test.cjs healthhub/tests/sh9-mav-gtfs-core-v1.test.cjs healthhub/tests/sh9-mav-google-fallback-v1.test.cjs healthhub/tests/sh9-mav-calendar-native-v603.test.cjs healthhub/tests/sh9-mav-smart-route-v604.test.cjs healthhub/tests/sh9-mav-personal-v607.test.cjs
      - name: Verify safe GTFS snapshot importer
        run: python3 -m unittest discover -s healthhub/tests -p 'test_sh9_mav_gtfs_import_v1.py' -v
