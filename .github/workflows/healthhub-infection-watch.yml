name: HealthHub NNGYK Infection Watch

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/healthhub-infection-watch.yml"
      - "healthhub/scripts/update_infection_watch.py"

permissions:
  contents: write

concurrency:
  group: healthhub-infection-watch
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install official-report parser
        run: python3 -m pip install --disable-pip-version-check "requests>=2.32,<3" "beautifulsoup4>=4.12,<5" "pdfplumber>=0.11,<1"
      - name: Read and validate newest NNGYK reports
        run: python3 healthhub/scripts/update_infection_watch.py
      - name: Validate outputs
        run: |
          python3 -m json.tool healthhub/data/infection-watch.json >/dev/null
          if [ -f healthhub/data/infection-history.json ]; then python3 -m json.tool healthhub/data/infection-history.json >/dev/null; fi
      - name: Commit only new validated reporting week
        run: |
          git config user.name "healthhub-nngyk-bot"
          git config user.email "healthhub-nngyk-bot@users.noreply.github.com"
          git add healthhub/data/infection-watch.json healthhub/data/infection-history.json
          if git diff --cached --quiet; then
            echo "No new official reporting week. Nothing to commit."
            exit 0
          fi
          git commit -m "data: update NNGYK weekly infection watch"
          git pull --rebase origin main
          git push origin HEAD:main
