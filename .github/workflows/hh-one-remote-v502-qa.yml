name: HH One v502 · Remote Service Android QA

on:
  pull_request:
    paths:
      - "healthhub/android-bridge/**"
      - "healthhub/live-v305.js"
      - "healthhub/live-v328.js"
      - "healthhub/live-v330.js"
      - "healthhub/hh-one-rag-v500.js"
      - "healthhub/index.html"
      - "healthhub/digital-health/**"
      - "healthhub/tests/hh-one-remote-v502.test.cjs"
      - "healthhub/tests/digital-wellbeing-v507.test.cjs"
      - "healthhub/tests/digital-wellbeing-roundtrip-v508.test.cjs"
      - ".github/workflows/hh-one-remote-v502-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify scoped remote controls, source and JS parse
        run: |
          node --check healthhub/live-v305.js
          node --check healthhub/live-v328.js
          node --check healthhub/live-v330.js
          node --check healthhub/hh-one-rag-v500.js
          node healthhub/tests/hh-one-remote-v502.test.cjs
          node --check healthhub/digital-health/digital-usage-vault-v507.js
          node --check healthhub/digital-health/digital-live-v507.js
          node healthhub/tests/digital-wellbeing-v507.test.cjs
          node healthhub/tests/digital-wellbeing-roundtrip-v508.test.cjs
          node healthhub/tests/hh-one-rag-v500.test.cjs
          node healthhub/tests/hh-one-service-intelligence-v501.test.cjs
  android-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: healthhub/android-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile isolated DEBUG only, no release or signing key
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify package / version from source
        run: |
          grep -F 'applicationId = "hu.zsoltmonika.healthhubbridge"' app/build.gradle.kts
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          BASE="$(python3 -c 'import json; print(json.load(open("../data/bridge-ota.json"))["versionCode"])')"
          # A web-only dashboard release keeps the already published Android build.
          # New Android candidates must instead increment it; JS contract checks both forms.
          test -n "$VERSION" && test "$CODE" -ge "$BASE"
          echo "Android package: $VERSION / build $CODE (signed production baseline build $BASE)"
          test -s app/build/outputs/apk/debug/app-debug.apk
