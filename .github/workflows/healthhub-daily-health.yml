name: HealthHub Daily Health Public

on:
  schedule:
    # Midnight context for private Daily Health: 00:30 Budapest is 22:30
    # previous day UTC in summer, or 23:30 UTC in winter.
    # Morning refresh for public Daily Health: 07:30 Budapest is 05:30
    # UTC in summer or 06:30 UTC in winter. Extra 07:30 UTC is fallback.
    # Python checks actual Europe/Budapest local time and skips wrong slots.
    - cron: "30 22,23,5,6,7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/healthhub-daily-health.yml"
      - "healthhub/scripts/generate_daily_health.py"
      - "healthhub/scripts/generate_daily_health_ai.py"

permissions:
  contents: write

concurrency:
  group: healthhub-daily-health
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Always load the newest data branch, including manual re-runs of old run IDs.
          ref: main
      - name: Generate public-only daily health context
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            python3 healthhub/scripts/generate_daily_health.py auto
          else
            python3 healthhub/scripts/generate_daily_health.py force
          fi
      - name: Generate public AI Daily Health briefing
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HEALTHHUB_AI_MODEL: gpt-4.1-mini
        run: |
          python3 healthhub/scripts/generate_daily_health_ai.py auto

      - name: Validate generated content
        shell: bash
        run: |
          if [ -f healthhub/data/daily-health-public.json ]; then
            python3 -m json.tool healthhub/data/daily-health-public.json >/dev/null
          fi
          if [ -f healthhub/data/daily-health-ai-public.json ]; then
            python3 -m json.tool healthhub/data/daily-health-ai-public.json >/dev/null
          fi
      - name: Publish public snapshot
        shell: bash
        run: |
          git config user.name "healthhub-health-bot"
          git config user.email "healthhub-health-bot@users.noreply.github.com"
          git add healthhub/data/daily-health-public.json
          if [ -f healthhub/data/daily-health-ai-public.json ]; then
            git add healthhub/data/daily-health-ai-public.json
          fi
          if git diff --cached --quiet; then
            echo "No new Daily Health data"
            exit 0
          fi
          git commit -m "data: Daily Health public morning snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
