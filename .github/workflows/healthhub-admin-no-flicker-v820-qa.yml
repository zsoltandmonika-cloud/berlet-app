name: HealthHub · Admin no-flicker v820 QA
on:
  pull_request:
    paths:
      - 'healthhub/index.html'
      - 'healthhub/live-v300.js'
      - 'healthhub/live-v306.js'
      - 'healthhub/hh-admin-mobile-focus-v748.js'
      - 'healthhub/tests/hh-admin-no-flicker-v820.test.cjs'
      - '.github/workflows/healthhub-admin-no-flicker-v820-qa.yml'
permissions:
  contents: read
jobs:
  stable-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check healthhub/live-v300.js
          node --check healthhub/live-v306.js
          node --check healthhub/hh-admin-mobile-focus-v748.js
          node --check healthhub/tests/hh-admin-no-flicker-v820.test.cjs
      - name: No flicker, stable navigation and existing Admin regression
        run: |
          node --test healthhub/tests/hh-admin-no-flicker-v820.test.cjs \
            healthhub/tests/hh-admin-mobile-v748.test.cjs \
            healthhub/tests/unified-admin-v745.test.cjs
