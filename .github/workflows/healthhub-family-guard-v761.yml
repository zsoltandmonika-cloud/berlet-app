name: HealthHub Family Guard v761 QA

on:
  push:
    branches:
      - 'feat/guardian-gps-map-phase1-v761'
    paths:
      - 'healthhub/guardian/**'
      - 'healthhub/health-timeline-entry-v761.js'
      - 'healthhub/premium-glass-home-v520.js'
      - 'healthhub/premium-glass-home-v520.css'
      - 'healthhub/tests/guardian-v761.test.cjs'
      - 'healthhub/tests/guardian-map-search-v819.test.cjs'
      - 'healthhub/tests/guardian-family-last-known-v807.test.cjs'
      - 'healthhub/tests/smart-hub-catalog-v801.test.cjs'
      - 'healthhub/tests/smart-hub-destination-v802.test.cjs'
      - 'healthhub/tests/smart-hub-native-v803.test.cjs'
      - 'healthhub/tests/smart-hub-router-v804.test.cjs'
      - 'healthhub/tests/smart-hub-go-v805.test.cjs'
      - 'healthhub/tests/smart-hub-v806.test.cjs'
      - 'healthhub/index.html'
      - '.github/workflows/healthhub-family-guard-v761.yml'
  pull_request:
    paths:
      - 'healthhub/guardian/**'
      - 'healthhub/health-timeline-entry-v761.js'
      - 'healthhub/premium-glass-home-v520.js'
      - 'healthhub/premium-glass-home-v520.css'
      - 'healthhub/tests/guardian-v761.test.cjs'
      - 'healthhub/tests/guardian-family-last-known-v807.test.cjs'
      - 'healthhub/index.html'
      - '.github/workflows/healthhub-family-guard-v761.yml'

jobs:
  guardian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check healthhub/guardian/guardian.js
          node --check healthhub/premium-glass-home-v520.js
          node --check healthhub/health-timeline-entry-v761.js
          node --check healthhub/tests/guardian-v761.test.cjs
          node --check healthhub/guardian/guardian-live-v785.js
          node --check healthhub/tests/guardian-family-last-known-v807.test.cjs
          node --check healthhub/guardian/guardian-bkk-catalog-v801.js
          node --check healthhub/guardian/guardian-bkk-watchlist-v814.js
          node --check healthhub/guardian/guardian-buddy-stop-core-v815.js
          node --check healthhub/guardian/guardian-buddy-stop-alert-v815.js
          node --check healthhub/tests/guardian-buddy-stop-alert-v815.test.cjs
          node --check healthhub/tests/guardian-buddy-stop-v815.test.cjs
          node --check healthhub/tests/guardian-bkk-watchlist-v814.test.cjs
          node --check healthhub/tests/guardian-bkk-live-watchlist-v816.test.cjs healthhub/tests/guardian-native-relay-v156.test.cjs
          node --check healthhub/guardian/guardian-native-dropbox-v156.js
          node --check healthhub/tests/guardian-native-relay-v156.test.cjs
          node --check healthhub/tests/smart-hub-catalog-v801.test.cjs
          node --check healthhub/guardian/guardian-smart-hub-v802.js
          node --check healthhub/tests/smart-hub-destination-v802.test.cjs
          node --check healthhub/guardian/guardian-smart-hub-native-v803.js
          node --check healthhub/tests/smart-hub-native-v803.test.cjs
          node --check healthhub/guardian/guardian-smart-hub-router-v804.js
          node --check healthhub/tests/smart-hub-router-v804.test.cjs
          node --check healthhub/tests/smart-hub-go-v805.test.cjs
          node --check healthhub/guardian/guardian-smart-hub-fields-v806.js
          node --check healthhub/guardian/guardian-map-search-v819.js
          node --check healthhub/tests/guardian-map-search-v819.test.cjs
          node --check healthhub/guardian/guardian-smart-hub-network-v806.js
          node --check healthhub/tests/smart-hub-v806.test.cjs
      - name: Run Guardian and Timeline migration checks
        run: node --test healthhub/tests/guardian-v761.test.cjs healthhub/tests/guardian-family-last-known-v807.test.cjs healthhub/tests/guardian-bkk-watchlist-v814.test.cjs healthhub/tests/guardian-bkk-live-watchlist-v816.test.cjs healthhub/tests/guardian-buddy-stop-alert-v815.test.cjs healthhub/tests/guardian-buddy-stop-v815.test.cjs healthhub/tests/smart-hub-catalog-v801.test.cjs healthhub/tests/smart-hub-destination-v802.test.cjs healthhub/tests/smart-hub-native-v803.test.cjs healthhub/tests/smart-hub-router-v804.test.cjs healthhub/tests/smart-hub-go-v805.test.cjs healthhub/tests/smart-hub-v806.test.cjs healthhub/tests/guardian-map-search-v819.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify synthetic BKK GTFS route extraction and fail-closed behavior
        run: |
          python -m unittest discover -s healthhub/guardian -p 'test_build_bkk_routes_v790.py' -v
          python -m unittest discover -s healthhub/guardian -p 'test_build_bkk_catalog_v801.py' -v
          python -m unittest discover -s healthhub/guardian -p 'test_build_bkk_network_v806.py' -v
