name: Family Guard Monika GPS viewer v1174 QA
on:
  pull_request:
    paths:
      - 'healthhub/guardian/guardian.js'
      - 'healthhub/guardian/guardian-live-v785.js'
      - 'healthhub/guardian/guardian-profile-follow-v837.js'
      - 'healthhub/guardian/index.html'
      - 'healthhub/guardian/guardian-native-source-v1174.css'
      - 'healthhub/tests/guardian-monika-native-independent-v1174.test.cjs'
      - '.github/workflows/hh-guardian-monika-native-v1174-qa.yml'
permissions:
  contents: read
jobs:
  source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check healthhub/guardian/guardian.js
          node --check healthhub/guardian/guardian-live-v785.js
          node --check healthhub/guardian/guardian-profile-follow-v837.js
          node --check healthhub/tests/guardian-monika-native-independent-v1174.test.cjs
      - name: Source proof and regression checks
        run: |
          node --test healthhub/tests/guardian-monika-native-independent-v1174.test.cjs
          node --test healthhub/tests/guardian-gps-owner-v1173.test.cjs
          node --test healthhub/tests/guardian-native-relay-v156.test.cjs
          node --test healthhub/tests/guardian-gps-source-flap-v1072.test.cjs
          node --test healthhub/tests/guardian-stale-owner-gps-v1071.test.cjs
