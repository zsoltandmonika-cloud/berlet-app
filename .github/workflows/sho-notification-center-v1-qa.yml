name: SHO Notification Center v1 QA
on:
  pull_request:
    paths:
      - 'sh9/notification-center/**'
      - 'sh9/shared/sh9-golden-bottom-nav-v924.*'
      - 'sh9/sho-preview/sho-wiring-v2.js'
      - 'sh9/tests/sho-notification-center-v1.test.cjs'
      - '.github/workflows/sho-notification-center-v1-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notification-center:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check notification JS syntax
        run: |
          node --check sh9/notification-center/notification-core-v1.js
          node --check sh9/notification-center/notification-center-v1.js
          node --check sh9/shared/sh9-golden-bottom-nav-v924.js
          node --check sh9/sho-preview/sho-wiring-v2.js
      - name: Notification core, Golden Standard and launcher regression
        run: |
          node --test sh9/tests/sho-notification-center-v1.test.cjs
