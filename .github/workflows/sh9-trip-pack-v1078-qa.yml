name: SH9 TripPack v1078 Saved Trips QA
on:
  pull_request:
    paths:
      - 'sh9/smart-travel/public-transport/smart-trip/**'
      - 'healthhub/tests/sh9-smart-trip-pack-v1078.test.cjs'
      - '.github/workflows/sh9-trip-pack-v1078-qa.yml'
  push:
    branches: [main]
    paths:
      - 'sh9/smart-travel/public-transport/smart-trip/**'
      - '.github/workflows/sh9-trip-pack-v1078-qa.yml'
permissions:
  contents: read
jobs:
  import-save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and regressions
        run: |
          node --check sh9/smart-travel/public-transport/smart-trip/smart-trip-pack-v1078.js
          node --test healthhub/tests/sh9-smart-trip-pack-v1078.test.cjs
          node --test healthhub/tests/sh9-smart-trip-chatgpt-default-v1076.test.cjs
          node --test healthhub/tests/sh9-smart-trip-auto-fallback-v1075.test.cjs
          node --test healthhub/tests/sh9-smart-trip-results-v1072.test.cjs
