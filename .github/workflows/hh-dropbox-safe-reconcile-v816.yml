name: HH ONE · Safe Dropbox Reconciliation QA
on:
  pull_request:
    paths:
      - 'healthhub/live-v161.js'
      - 'healthhub/device-registry-v401.js'
      - 'healthhub/index.html'
      - 'healthhub/tests/dropbox-safe-reconcile-v816.test.cjs'
      - 'healthhub/android-bridge/**'
      - '.github/workflows/hh-dropbox-safe-reconcile-v816.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dropbox-transaction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and verify old credentials survive an account mismatch
        run: |
          node --check healthhub/live-v161.js
          node --check healthhub/device-registry-v401.js
          node --test healthhub/tests/dropbox-safe-reconcile-v816.test.cjs
          node --test healthhub/tests/hh-one-device-status-v504.test.cjs
  android-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: healthhub/android-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android tests and compile only (NO OTA)
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
