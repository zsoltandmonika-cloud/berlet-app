name: Guardian v1054 laptop-safe tall logo-only preview QA
on:
  pull_request:
    paths:
      - 'healthhub/guardian/index.html'
      - 'healthhub/guardian/guardian-device-pack-tall-v1054.css'
      - 'healthhub/guardian/guardian-device-pack-tall-v1054.js'
      - 'healthhub/tests/guardian-device-pack-tall-v1054.test.cjs'
      - '.github/workflows/guardian-device-pack-tall-v1054-qa.yml'
  push:
    branches: [main]
    paths:
      - 'healthhub/guardian/index.html'
      - 'healthhub/guardian/guardian-device-pack-tall-v1054.css'
      - 'healthhub/guardian/guardian-device-pack-tall-v1054.js'
      - 'healthhub/tests/guardian-device-pack-tall-v1054.test.cjs'
      - '.github/workflows/guardian-device-pack-tall-v1054-qa.yml'
jobs:
  tall:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check healthhub/guardian/guardian-device-pack-tall-v1054.js
      - name: Tall preview safety and existing v1053 functionality
        run: node --test healthhub/tests/guardian-device-pack-tall-v1054.test.cjs healthhub/tests/guardian-device-pack-v1053.test.cjs
