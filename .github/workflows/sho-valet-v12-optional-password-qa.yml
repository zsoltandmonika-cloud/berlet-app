name: SHO Smart Valet v12 · Optional Password and Preview Privacy QA
on:
  pull_request:
    paths:
      - 'sh9/wallet/**'
      - 'sh9/tests/sho-smart-valet-id-v11.test.cjs'
      - 'sh9/tests/sho-smart-valet-id-v12-optional-password.test.cjs'
      - 'supabase/migrations/20261105183000_sho_valet_id_v12_optional_password.sql'
      - '.github/workflows/sho-valet-v12-optional-password-qa.yml'
  push:
    branches: [main]
    paths:
      - 'sh9/wallet/**'
      - 'sh9/tests/sho-smart-valet-id-v11.test.cjs'
      - 'sh9/tests/sho-smart-valet-id-v12-optional-password.test.cjs'
      - 'supabase/migrations/20261105183000_sho_valet_id_v12_optional_password.sql'
permissions:
  contents: read
jobs:
  optional-password:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Validate optional password, encrypted device mode and Golden UI
        run: |
          node --check sh9/wallet/smart-valet-identity-v11.js
          node --test sh9/tests/sho-smart-valet-id-v12-optional-password.test.cjs
          node --test sh9/tests/sho-smart-valet-id-v11.test.cjs
          node --test sh9/tests/sho-smart-valet-v10-coupons-identity.test.cjs
          node --test sh9/tests/sho-smart-valet-private-v7.test.cjs
          node --test sh9/tests/sho-smart-valet-loyalty-v9.test.cjs
          node --test sh9/tests/sho-smart-valet-bkk-nav-v5.test.cjs
