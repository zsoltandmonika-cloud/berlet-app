name: Family Guard v1056 uploaded logo asset materialization
on:
  push:
    branches:
      - feature/guardian-full-height-brand-v1056
    paths:
      - '.github/workflows/guardian-v1056-logo-materialize.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/guardian-full-height-brand-v1056
          persist-credentials: true
      - name: Restore original user-supplied logo from private repo git object
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p healthhub/assets
          gh api "repos/$REPO/git/blobs/4d54788b37e2794d9db12d765e4440404ef62c3c" --jq '.content' | base64 -d > healthhub/assets/sh9-family-guard-logo-v1056.webp
          file healthhub/assets/sh9-family-guard-logo-v1056.webp
          python - <<'PY'
          from pathlib import Path
          p=Path('healthhub/assets/sh9-family-guard-logo-v1056.webp')
          b=p.read_bytes()
          assert b[:4]==b'RIFF' and b[8:12]==b'WEBP'
          declared=int.from_bytes(b[4:8],'little')+8
          print('WebP bytes:',len(b),'declared bytes:',declared)
          # The Git object is three padding bytes short of RIFF's declared
          # length. Restore only the missing trailing padding and *then*
          # require a complete pixel decode before any commit.
          missing=declared-len(b)
          assert 0<=missing<=3, 'Logo has unexpected structural damage'
          if missing:
              p.write_bytes(b+b'\\x00'*missing)
          PY
          python -m pip -q install pillow
          python - <<'PY'
          from PIL import Image
          p='healthhub/assets/sh9-family-guard-logo-v1056.webp'
          with Image.open(p) as image:
              image.load()
              assert image.size==(160,51),image.size
              assert image.mode in ('RGB','RGBA')
              print('Validated original logo image:',image.size,image.mode)
          PY
      - name: Commit the exact logo to the preview branch (never directly main)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add healthhub/assets/sh9-family-guard-logo-v1056.webp
          git diff --cached --quiet && exit 0
          git commit -m "asset(Guardian v1056): original supplied SH9 Family Guard logo"
          git push origin HEAD:feature/guardian-full-height-brand-v1056
