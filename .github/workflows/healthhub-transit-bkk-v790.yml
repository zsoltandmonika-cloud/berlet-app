name: HealthHub Transit v790 · Official BKK GTFS Snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '25 3 * * *'
  push:
    branches: [main]
    paths:
      - 'healthhub/guardian/build-bkk-routes-v790.py'
      - 'healthhub/guardian/build-bkk-catalog-v801.py'
      - 'healthhub/guardian/build-bkk-network-v806.py'
      - 'healthhub/guardian/build-bkk-timetable-v859.py'
      - '.github/workflows/healthhub-transit-bkk-v790.yml'

permissions:
  contents: write

concurrency:
  group: hh-bkk-transit-main
  cancel-in-progress: false

jobs:
  refresh-bkk:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate BKK official GTFS
        run: python healthhub/guardian/build-bkk-routes-v790.py
      - name: Validate produced route geometry and stop lists
        run: |
          python - <<'PY'
          import json
          f=json.load(open('healthhub/guardian/bkk-routes-v790.json',encoding='utf-8'))
          assert set(f['routes']) == {'260','17','19','1','41'}
          assert all(len(x['variants']) > 0 for x in f['routes'].values())
          assert all(len(v['shape']) > 1 and len(v['stops']) > 0 for r in f['routes'].values() for v in r['variants'])
          print(f['generatedAt'],[(k,len(v['variants'])) for k,v in f['routes'].items()])
          PY
      - name: Verify v801 full GTFS catalog and source-backed modes
        run: |
          python -m unittest discover -s healthhub/guardian -p 'test_build_bkk_catalog_v801.py' -v
          python - <<'PY'
          import json
          f=json.load(open('healthhub/guardian/bkk-catalog-v801.json',encoding='utf-8'))
          assert f['schemaVersion']==1 and f['source']=='BKK Zrt., CC BY 4.0'
          assert len(f['routes'])>100
          assert {'260','17','19','1','41'}.issubset({x['id'] for x in f['routes']})
          assert all(x['gtfsRouteIds'] for x in f['routes'])
          print("Verified official BKK catalogue",len(f['routes']),"lines")
          PY
      - name: Verify expanded v806 BKK directed stop graph
        run: |
          python -m unittest discover -s healthhub/guardian -p 'test_build_bkk_network_v806.py' -v
          python - <<'PY'
          import json
          f=json.load(open('healthhub/guardian/bkk-network-v806.json',encoding='utf-8'))
          assert f['schemaVersion']==1 and f['source']=='BKK Zrt., CC BY 4.0'
          assert len(f['routes'])>=100
          assert {'260','17','19'}.issubset({x['id'] for x in f['routes']})
          assert all(len(x['stops'])>=2 for x in f['routes'])
          assert all(all(isinstance(y[2],(int,float)) and isinstance(y[3],(int,float)) for y in x['stops']) for x in f['routes'])
          print('Verified v806 full BKK static stop graph:',len(f['routes']),'directed variants')
          PY
      - name: Validate BKK timetable v859 scheduled stop times
        run: |
          python - <<'PY'
          import json
          f=json.load(open('healthhub/guardian/bkk-timetable-v859.json',encoding='utf-8'))
          assert f['source']=='BKK Zrt., CC BY 4.0' and f['schemaVersion']==1
          assert len(f['trips'])>=50 and '260' in f['routes']
          assert all(isinstance(s[1],int) and isinstance(s[2],int) and s[1]<=s[2] for _,_,stops in f['trips'] for s in stops)
          print('Verified planned GTFS departures:',len(f['trips']),'trip instances')
          PY
      - name: Publish BKK snapshot to GitHub Pages source branch
        run: |
          git config user.name "healthhub-bkk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add healthhub/guardian/bkk-routes-v790.json healthhub/guardian/bkk-catalog-v801.json healthhub/guardian/bkk-network-v806.json healthhub/guardian/bkk-timetable-v859.json
          if git diff --cached --quiet; then
            echo "BKK snapshot is unchanged."
            exit 0
          fi
          git commit -m "data(transit): refresh official BKK GTFS snapshot [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
