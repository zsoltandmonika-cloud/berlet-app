name: HealthHub Connect · Debug Build (not OTA)

on:
  push:
    branches: ["main", "health-connect-mvp", "healthhub-hc-expanded-v149", "feature/healthhub-connect-ota-staged-v014"]
    paths:
      - "healthhub/android-bridge/**"
      - ".github/workflows/healthhub-bridge-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: healthhub-bridge-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: healthhub/android-bridge
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
      - name: Prepare named APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "HealthHub-Connect-v${{ steps.version.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: healthhub-connect-v${{ steps.version.outputs.version }}
          path: healthhub/android-bridge/HealthHub-Connect-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error
      # Debug artifacts intentionally remain CI-only. Each GitHub runner
      # generates a different debug signing key; those APKs CANNOT replace
      # one another in place. Only the separate secret-signed OTA workflow
      # publishes installable auto-update releases.
