name: HealthHub Bridge Android APK

on:
  push:
    branches: ["main", "health-connect-mvp", "healthhub-hc-expanded-v149"]
    paths:
      - "healthhub/android-bridge/**"
      - ".github/workflows/healthhub-bridge-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: healthhub/android-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: healthhub-connect-debug-apk
          path: healthhub/android-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
