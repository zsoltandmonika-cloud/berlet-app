name: SHO Fancy PWA icon materialization v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sho-fancy-pwa-icon-v1.yml'
      - 'sh9/tools/build-sho-fancy-icons-v1.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sho-fancy-pwa-assets
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Rasterize the ORIGINAL approved SHO Fancy SVG
        run: |
          python -m pip install --disable-pip-version-check -q cairosvg pillow
          python sh9/tools/build-sho-fancy-icons-v1.py
      - name: Verify PNG signatures and dimensions
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          expected = {
            'sho-fancy-install-192-v1.png': (192, 192),
            'sho-fancy-install-512-v1.png': (512, 512),
            'sho-fancy-maskable-512-v1.png': (512, 512),
            'sho-fancy-touch-180-v1.png': (180, 180),
          }
          for name, dim in expected.items():
              p = Path('sh9/assets') / name
              assert p.read_bytes()[:8] == bytes.fromhex('89504e470d0a1a0a')
              with Image.open(p) as image:
                  image.verify()
                  assert image.size == dim, (name, image.size, dim)
              print('VALID:', name, p.stat().st_size)
          PY
      - name: Materialize new icons into main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sh9/assets/sho-fancy-*.png
          if git diff --cached --quiet; then
            echo "All SHO Fancy icons already materialized"
            exit 0
          fi
          git commit -m "asset(SHO): approved Fancy PWA install, maskable and shortcut icons"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
