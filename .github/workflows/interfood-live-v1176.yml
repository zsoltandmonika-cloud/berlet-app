name: HealthHub Interfood Live · Smart Feed v1176
on:
  workflow_dispatch:
  schedule:
    - cron: '27 4,10 * * *'
  push:
    branches:
      - main
      - feature/interfood-live-auto-v1176
    paths:
      - '.github/workflows/interfood-live-v1176.yml'
      - 'healthhub/scripts/interfood_live_sync_v1176.py'
      - 'healthhub/tests/interfood-live-v1176.test.cjs'
permissions:
  contents: write
concurrency:
  group: interfood-live-menu-feed-v1176
  cancel-in-progress: false
jobs:
  smart-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Public Interfood menu extraction (no account, no credentials)
        run: python healthhub/scripts/interfood_live_sync_v1176.py
      - name: Commit validated public feed only if changed
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'HealthHub Interfood Live'
          git config user.email 'actions@users.noreply.github.com'
          git add healthhub/nutrition/interfood-live-feed-v1176.json
          if ! git diff --cached --quiet; then
            git commit -m 'data(nutrition): verified Interfood menu feed refresh v1176'
            git push origin HEAD:main
          fi
