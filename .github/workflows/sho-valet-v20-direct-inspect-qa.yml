name: SHO Smart Valet v20 · Direct Fullscreen BKK QA
on:
  pull_request:
    paths:
      - 'sh9/wallet/**'
      - 'sh9/tests/sho-smart-valet-v20-direct-inspect.test.cjs'
      - '.github/workflows/sho-valet-v20-direct-inspect-qa.yml'
  push:
    branches: [main]
    paths:
      - 'sh9/wallet/**'
      - 'sh9/tests/sho-smart-valet-v20-direct-inspect.test.cjs'
permissions:
  contents: read
jobs:
  direct-inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify automatic BKK inspection and protected card regressions
        run: |
          node --check sh9/wallet/smart-valet-extra-v15.js
          node --check sh9/wallet/smart-valet-bkk-fullscreen-v17.js
          node --test sh9/tests/sho-smart-valet-v20-direct-inspect.test.cjs
          node --test sh9/tests/sho-smart-valet-v18-bkk-rotate.test.cjs
          node --test sh9/tests/sho-smart-valet-v17-bkk-pass.test.cjs
          node --test sh9/tests/sho-smart-valet-v16-unified-optical.test.cjs
          node --test sh9/tests/sho-smart-valet-v15-health-bank.test.cjs
          node --test sh9/tests/sho-smart-valet-v13-universal-pin.test.cjs
