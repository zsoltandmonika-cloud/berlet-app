name: Family Guard owner GPS and Monika last-known v1196 QA
on:
  pull_request:
    paths:
      - 'healthhub/guardian/guardian.js'
      - 'healthhub/guardian/guardian-profile-follow-v837.js'
      - 'healthhub/guardian/index.html'
      - 'healthhub/tests/guardian-owner-and-monika-last-known-v1196.test.cjs'
      - 'healthhub/tests/guardian-monika-native-independent-v1174.test.cjs'
      - '.github/workflows/guardian-owner-monika-gps-v1196-qa.yml'

permissions:
  contents: read

jobs:
  gps-local-and-remote-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate changed Guardian scripts
        run: |
          node --check healthhub/guardian/guardian.js
          node --check healthhub/guardian/guardian-profile-follow-v837.js
      - name: Verify Monika last known safety, correct owner GPS and unchanged native marker semantics
        run: |
          node --test healthhub/tests/guardian-owner-and-monika-last-known-v1196.test.cjs
          node --test healthhub/tests/guardian-monika-native-independent-v1174.test.cjs
          node --test healthhub/tests/guardian-stable-gps-markers-v1181.test.cjs
