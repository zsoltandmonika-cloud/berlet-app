name: SHO v1161 · Icon outlines only rollback QA
on:
  push:
    branches:
      - fix/sho-icon-strokes-only-v1161
    paths:
      - 'sh9/index.html'
      - 'sh9/sho-preview/sho-wiring-v2.js'
      - 'sh9/tests/sho-icons-outline-only-v1161.test.cjs'
      - '.github/workflows/sho-icon-outline-only-v1161-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS syntax
        run: node --check sh9/sho-preview/sho-wiring-v2.js
      - name: Verify 12 original active buttons and five icon outlines only
        run: node --test sh9/tests/sho-icons-outline-only-v1161.test.cjs
      - name: Confirm HealthHub Golden Sleep and native HH One untouched
        run: |
          git fetch origin main --depth=1
          CHANGED=$(git diff --name-only origin/main HEAD)
          printf '%s\n' "$CHANGED"
          if printf '%s\n' "$CHANGED" | grep -E '(^healthhub/|^sh9/shared/|^sh9/smart-travel/)'; then
            echo 'Protected module unexpectedly modified'
            exit 1
          fi
