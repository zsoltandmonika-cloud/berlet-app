name: SHO Smart Product Match V2.1 QA
on:
  pull_request:
    paths:
      - 'sh9/shopping/product-match-*'
      - 'sh9/shopping/three-store-bridge-v2.html'
      - 'healthhub/tests/sho-product-match-v21.test.cjs'
      - '.github/workflows/sho-product-match-v21.yml'
  push:
    branches: [main]
    paths:
      - 'sh9/shopping/product-match-*'
      - 'sh9/shopping/three-store-bridge-v2.html'
      - 'healthhub/tests/sho-product-match-v21.test.cjs'
      - '.github/workflows/sho-product-match-v21.yml'
permissions:
  contents: read
jobs:
  product-match:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate product matching syntax
        run: |
          node --check sh9/shopping/product-match-core-v21.js
          node --check sh9/shopping/product-match-v21.js
      - name: Test live UI behavior with mocked OFF feed and data integrity
        run: node --test healthhub/tests/sho-product-match-v21.test.cjs
      - name: Preserve 3-store bridge contracts
        run: node --test healthhub/tests/sho-three-store-bridge-v2.test.cjs
