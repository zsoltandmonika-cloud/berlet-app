name: HealthHub Level 3 Guard

on:
  pull_request:
    paths:
      - "healthhub/**"
      - ".github/workflows/healthhub-level3-guard.yml"
      - ".github/workflows/healthhub-daily-free.yml"
      - ".github/workflows/healthhub-daily-health.yml"
  schedule:
    # 00:15 Budapest local time: summer 22:15 UTC, winter 23:15 UTC.
    - cron: '15 22,23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "healthhub/**"
      - ".github/workflows/healthhub-level3-guard.yml"
      - ".github/workflows/healthhub-daily-free.yml"
      - ".github/workflows/healthhub-daily-health.yml"

permissions:
  contents: write

concurrency:
  group: healthhub-level3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create pre-change backup branch
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          SHORT="$(echo "${GITHUB_SHA}" | cut -c1-8)"
          BRANCH="auto-backup/healthhub-${SHORT}"
          echo "Creating ${BRANCH} -> ${BEFORE}"
          git push origin "${BEFORE}:refs/heads/${BRANCH}" || echo "Backup branch already exists or could not be recreated."

      - name: Validate HealthHub release
        id: validate
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          function fail(msg){ console.error('HEALTHHUB GUARD FAIL:', msg); process.exitCode = 1; }
          function read(p){ return fs.readFileSync(p,'utf8'); }

          const index = read('healthhub/index.html');
          const meta = (index.match(/healthhub-live-build" content="([^"]+)"/)||[])[1];
          const boot = (index.match(/var v='([^']+)'/)||[])[1];
          if(!meta || !boot) fail('Missing live build markers in index.html');
          if(meta !== 'v'+boot) fail('Live build mismatch: meta='+meta+' boot='+boot);

          for (const file of ['healthhub/live-v147.js','healthhub/live-v148.js','healthhub/live-v149.js','healthhub/live-v151.js','healthhub/live-v161.js','healthhub/live-v184.js','healthhub/live-v191.js','healthhub/live-v260.js','healthhub/live-v266.js','healthhub/live-v300.js','healthhub/live-v301.js','healthhub/live-v303a.js','healthhub/live-v304.js','healthhub/live-v312.js']) {
            if(!fs.existsSync(file)) { if(file.endsWith('v301.js')) fail('Missing '+file); continue; }
            try { new Function(read(file)); console.log('Syntax PASS', file); }
            catch(e) { fail('JavaScript syntax error in '+file+': '+e.message); }
          }

          for (const file of ['healthhub/project-control.json','healthhub/ai-execution-status.json']) {
            try { JSON.parse(read(file)); console.log('JSON PASS', file); }
            catch(e) { fail('Invalid JSON in '+file+': '+e.message); }
          }

          for (const file of ['healthhub/live-v147.js','healthhub/live-v148.js','healthhub/live-v149.js','healthhub/live-v151.js','healthhub/live-v161.js','healthhub/live-v184.js','healthhub/live-v191.js']) {
            const src = read(file);
            if (/indexedDB\.open\((?:DB|BRIDGE_DB),\s*2\)/.test(src)) fail('Bridge schema regression: '+file+' still opens healthhub-connect-v1 as v2');
          }

          if (!/live-v304\.js\?v=304-central-structured-vault-20261008/.test(index)) fail('v304 Central Structured Vault loader missing');
          const master = read('healthhub/live-v304.js');
          for (const p of ['/HealthHub/master/manifest.json','/HealthHub/master/documents.json','/HealthHub/master/explanations.json','/HealthHub/master/medications.json','/HealthHub/master/profiles.json','/HealthHub/master/appointments.json']) {
            if (!master.includes(p)) fail('v304 master path missing: '+p);
          }

          const v301Ref = /live-v301\.js\?v=301/.test(index);
          if(!v301Ref) fail('index.html does not load live-v301.js?v=301...');

          const combined = read('healthhub/live-v260.js') + '\n' + read('healthhub/live-v266.js') + '\n' + read('healthhub/live-v301.js') + '\n' + read('healthhub/ai-execution-status.json');
          const secretPatterns = [
            /ghp_[A-Za-z0-9]{20,}/,
            /github_pat_[A-Za-z0-9_]{20,}/,
            /sk-[A-Za-z0-9_-]{20,}/,
            /client_secret\s*[:=]\s*["'][^"']+/i
          ];
          secretPatterns.forEach(re => { if(re.test(combined)) fail('Possible secret detected by '+re); });

          if(process.exitCode) process.exit(process.exitCode);
          console.log('HealthHub Level 3 validation PASS · build', meta);
          NODE
          python3 -m py_compile healthhub/scripts/generate_daily_health.py
          python3 -m py_compile healthhub/scripts/generate_daily_health_ai.py
          python3 -m py_compile healthhub/scripts/generate_daily_ai.py

      # The validation must pass before any new Golden Backup is created.
      # A Git annotated tag is the immutable source-code snapshot and audit entry.
      # Rollback is intentionally MANUAL; a failing check never changes main.
      - name: Golden Backup after successful HealthCheck
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          VERIFIED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Cron runs twice to cover DST; only local midnight is accepted.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            HOUR="$(TZ=Europe/Budapest date +%H)"
            if [ "$HOUR" != "00" ]; then
              echo "Scheduled run outside Budapest midnight ($HOUR): skip backup."
              exit 0
            fi
          fi
          bash healthhub/scripts/golden-backup.sh
