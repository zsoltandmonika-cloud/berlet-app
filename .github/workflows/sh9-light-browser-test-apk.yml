name: SH9 Light Browser · S24 Ultra Test APK
on:
  push:
    branches: [main]
    paths:
      - "sh9/android-light-browser/**"
      - ".github/workflows/sh9-light-browser-test-apk.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sh9-light-browser-apk
  cancel-in-progress: false
jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sh9/android-light-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Fetch existing approved SH9 icon
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          curl --fail --location --silent --show-error --retry 3 \
            "https://raw.githubusercontent.com/zsoltandmonika-cloud/berlet-app/main/sh9/assets/sh9-icon.png" \
            --output app/src/main/res/drawable-nodpi/sh9_launcher.png
          file app/src/main/res/drawable-nodpi/sh9_launcher.png
      - name: Bundle approved SH9 v23 Golden Uniform Launcher snapshot
        run: |
          mkdir -p app/src/main/assets/sh9
          cp ../index.html app/src/main/assets/sh9/index.html
          cp ../SH9_official_v21.css app/src/main/assets/sh9/SH9_official_v21.css
          cp ../assets/SH9_Official_Hero_v21.webp app/src/main/assets/sh9/SH9_Official_Hero_v21.webp
          cp ../assets/SH9_Official_Tiles_v21.webp app/src/main/assets/sh9/SH9_Official_Tiles_v21.webp
          cp ../sh9-info-v6.js app/src/main/assets/sh9/sh9-info-v6.js
          cp ../../healthhub/data/namedays.json app/src/main/assets/sh9/namedays.json
          grep -Fq 'data-nav="Vissza"' app/src/main/assets/sh9/index.html
          grep -Fq 'id="sh9-hh-uniform-v23"' app/src/main/assets/sh9/index.html
          test "$(grep -o 'class="tile-inner"' app/src/main/assets/sh9/index.html | wc -l)" -eq 9
          grep -Fq 'SH9_official_v21.css?v=22' app/src/main/assets/sh9/index.html
          grep -Fq '.grid>.tile:nth-child(5)::after' app/src/main/assets/sh9/SH9_official_v21.css
          test -s app/src/main/assets/sh9/SH9_Official_Hero_v21.webp
          test -s app/src/main/assets/sh9/SH9_Official_Tiles_v21.webp
      - name: Assemble installable debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify bundled approved launcher assets in APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          for name in index.html SH9_official_v21.css SH9_Official_Hero_v21.webp SH9_Official_Tiles_v21.webp sh9-info-v6.js namedays.json; do
            unzip -l "$APK" "assets/sh9/$name" | grep -Fq "assets/sh9/$name"
          done
          echo "All 6 approved Launcher resources are packaged in the APK."
      - name: Publish test installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SH9-Light-Browser-S24Ultra-v0.1.3-test4.apk
          gh release create sh9-light-browser-v0.1.3-test4 \
            SH9-Light-Browser-S24Ultra-v0.1.3-test4.apk \
            --title "SH9 Light Browser · S24 Ultra Test 4" \
            --notes "Bundled SH9 v23 with actual HealthHub Golden Standard glass tiles, uniform flat taskbar, pink Ask Lena tile and working Back; live HealthHub and Family Guard. Android status/navigation bars hidden; native WebView. Debug signed. Does not replace HH One." \
            --prerelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sh9-light-browser-test-apk
          path: sh9/android-light-browser/SH9-Light-Browser-S24Ultra-v0.1.3-test4.apk
          if-no-files-found: warn
