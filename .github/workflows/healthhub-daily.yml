name: HealthHub Daily Content

on:
  schedule:
    - cron: "7 6 * * *"
      timezone: "Europe/Budapest"
    - cron: "7 7 * * *"
      timezone: "Europe/Budapest"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to generate"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - spark
          - briefing

permissions:
  contents: write

concurrency:
  group: healthhub-daily-content
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-luna

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select generation mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "7 6 * * *" ]; then
            echo "value=spark" >> "$GITHUB_OUTPUT"
          else
            echo "value=briefing" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify OpenAI secret
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Repository secret OPENAI_API_KEY is not configured."
            exit 1
          fi

      - name: Generate HealthHub daily content
        run: python3 healthhub/scripts/generate_daily.py "${{ steps.mode.outputs.value }}"

      - name: Validate JSON
        shell: bash
        run: |
          python3 -m json.tool healthhub/data/daily-spark.json >/dev/null
          python3 -m json.tool healthhub/data/daily-briefing.json >/dev/null

      - name: Commit updated data
        shell: bash
        run: |
          git config user.name "healthhub-bot"
          git config user.email "healthhub-bot@users.noreply.github.com"
          git add healthhub/data/daily-spark.json healthhub/data/daily-briefing.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "HealthHub daily content: ${{ steps.mode.outputs.value }}"
          git pull --rebase origin main
          git push origin HEAD:main
