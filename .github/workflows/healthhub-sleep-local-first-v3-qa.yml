name: HealthHub Sleep Local-First V3 QA
on:
  push:
    branches: [main]
    paths:
      - "healthhub/sleep-fast/**"
      - "healthhub/sleep-one/**"
      - "healthhub/live-v170.js"
      - "sh9/index.html"
      - "sh9/sho-preview/index.html"
      - "sh9/sho-preview/sho-wiring-v2.js"
      - ".github/workflows/healthhub-sleep-local-first-v3-qa.yml"
  pull_request:
    paths:
      - "healthhub/sleep-fast/**"
      - "healthhub/sleep-one/**"
      - "healthhub/live-v170.js"
      - "sh9/index.html"
      - "sh9/sho-preview/index.html"
      - "sh9/sho-preview/sho-wiring-v2.js"
      - ".github/workflows/healthhub-sleep-local-first-v3-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-sleep-localfirst:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Sleep local-first, stage source and privacy
        run: |
          node --check healthhub/sleep-fast/sleep-local-v3.js
          node --check healthhub/live-v170.js
          node --check healthhub/sleep-three-views-v428.js
          node --test healthhub/sleep-fast/sleep-local-v3.test.cjs healthhub/sleep-fast/sleep-verified-render-v3.test.cjs
