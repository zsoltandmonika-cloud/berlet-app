name: HealthHub Activity Hero v258 Import

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/healthhub-hero-v258-import.yml'

permissions:
  contents: write

jobs:
  import-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download approved hero
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 'https://1drv.ms/u/c/bc1ff24af37ea2b0/IQCxgEMuyNRSS6MJmv8BA7meATfRBlp4VNnzjDUhwZV-7VA?download=1' -o healthhub/assets/activity-hero-approved-v258.webp
          python - <<'PY'
          from pathlib import Path
          p=Path('healthhub/assets/activity-hero-approved-v258.webp')
          b=p.read_bytes()
          if len(b) < 100000:
              raise SystemExit(f'Hero too small: {len(b)} bytes')
          if b[:4] != b'RIFF' or b[8:12] != b'WEBP':
              raise SystemExit('Downloaded file is not a valid WEBP')
          print('Hero OK:', len(b), 'bytes')
          PY

      - name: Activate v258 hero
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          live=Path('healthhub/live-v191.js')
          s=live.read_text(encoding='utf-8')
          s2=re.sub(
              r"function heroSrc\(\)\{.*?\n\}",
              "function heroSrc(){return './assets/activity-hero-approved-v258.webp?v=258'}",
              s,
              count=1,
              flags=re.S
          )
          if s2==s:
              raise SystemExit('heroSrc block was not replaced')
          live.write_text(s2,encoding='utf-8')

          idx=Path('healthhub/index.html')
          h=idx.read_text(encoding='utf-8')
          h=re.sub(r'(<meta name="healthhub-live-build" content=")v\d+(")', r'\1v258\2', h, count=1)
          h=re.sub(r'(manifest\.webmanifest\?v=)\d+', r'\g<1>258', h, count=1)
          h=re.sub(r"var v='\d+';", "var v='258';", h, count=1)
          h=h.replace("./live-v191.js?v=257-activity-hero-integrity-fallback-20261006","./live-v191.js?v=258-activity-hero-file-20261006")
          h=h.replace("document.documentElement.dataset.healthhubShortcut='257';","document.documentElement.dataset.healthhubShortcut='258';")
          h=h.replace("window.HH_LIVE_BUILD='v257-activity-hero-integrity-fallback';","window.HH_LIVE_BUILD='v258-activity-hero-file';")
          idx.write_text(h,encoding='utf-8')

          man=Path('healthhub/manifest.webmanifest')
          m=man.read_text(encoding='utf-8')
          m=re.sub(r'("start_url"\s*:\s*"\.\/index\.html\?hhv=)\d+(")', r'\g<1>258\2', m, count=1)
          man.write_text(m,encoding='utf-8')
          PY

      - name: Commit v258 hero
        run: |
          set -euo pipefail
          git config user.name "HealthHub Automation"
          git config user.email "actions@users.noreply.github.com"
          git add healthhub/assets/activity-hero-approved-v258.webp healthhub/live-v191.js healthhub/index.html healthhub/manifest.webmanifest
          git diff --cached --quiet && exit 0
          git commit -m "HealthHub: activate approved Activity hero v258"
          git push origin main
