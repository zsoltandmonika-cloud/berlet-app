name: HH One · One-Tap Repair QA
on:
  pull_request:
    paths:
      - "healthhub/hh-one-repair-routing-v503.js"
      - "healthhub/hh-one-rag-v500.js"
      - "healthhub/hh-admin-mobile-focus-v748.js"
      - "healthhub/index.html"
      - "healthhub/digital-health/index.html"
      - "healthhub/tests/hh-one-one-tap-repair-v503.test.cjs"
      - ".github/workflows/hh-one-one-tap-repair-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  one-click-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax and safe repair routes
        run: |
          node --check healthhub/hh-one-repair-routing-v503.js
          node --check healthhub/hh-one-rag-v500.js
          node --check healthhub/hh-admin-mobile-focus-v748.js
          node --test healthhub/tests/hh-one-one-tap-repair-v503.test.cjs
      - name: Existing HH One and Admin regression checks
        run: |
          node healthhub/tests/hh-one-rag-v500.test.cjs
          node healthhub/tests/hh-one-service-center-502.test.cjs
          node --test healthhub/tests/hh-admin-mobile-v748.test.cjs
          node --test healthhub/tests/sh9-version-center.test.cjs
