name: HH ONE · Post-validation Housekeeping Readiness
# This validates the safety gate itself. It NEVER reads live phone/Dropbox data,
# runs a remote command, creates a backup or changes any device registry.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'healthhub/housekeeping/**'
      - 'healthhub/tests/housekeeping-gate-v1.test.cjs'
      - 'healthhub/docs/HH_ONE_POST_VALIDATION_HOUSEKEEPING_V1.md'
      - '.github/workflows/hh-one-housekeeping-readiness-v1.yml'
permissions:
  contents: read
jobs:
  readonly-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and fail-closed validation
        run: |
          node --check healthhub/housekeeping/housekeeping-gate-v1.cjs
          node --test healthhub/tests/housekeeping-gate-v1.test.cjs
      - name: Verify workflow remains read-only
        run: |
          node healthhub/housekeeping/housekeeping-gate-v1.cjs
          if grep -Ein 'secrets\.|curl |wget |writeFile|unlinkSync|rm -rf|uploadJson|DELETE FROM|UPDATE public\.' healthhub/housekeeping/housekeeping-gate-v1.cjs; then
            echo 'Unexpected write/credential/network operation in housekeeping gate'
            exit 1
          fi
          echo 'HOUSEKEEPING SAFETY GATE READY · no live cleanup, no remote writes.'
