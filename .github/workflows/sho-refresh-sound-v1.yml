name: SHO refresh sound isolation QA
on:
  pull_request:
    paths:
      - 'sh9/shared/sho-refresh-sound*'
      - 'healthhub/tests/sho-refresh-sound-v1.test.cjs'
      - '.github/workflows/sho-refresh-sound-v1.yml'
  push:
    branches: [main]
    paths:
      - 'sh9/shared/sho-refresh-sound*'
      - 'healthhub/tests/sho-refresh-sound-v1.test.cjs'
      - '.github/workflows/sho-refresh-sound-v1.yml'
permissions:
  contents: read
jobs:
  sound-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check sh9/shared/sho-refresh-sound-v1.js && node --test healthhub/tests/sho-refresh-sound-v1.test.cjs
