name: SH9 Smart Trip ChatGPT default v1076 QA
on:
  pull_request:
    paths:
      - 'sh9/smart-travel/public-transport/smart-trip/**'
      - 'healthhub/tests/sh9-smart-trip-chatgpt-default-v1076.test.cjs'
      - 'healthhub/tests/sh9-smart-trip-auto-fallback-v1075.test.cjs'
      - 'healthhub/tests/guardian-smart-places-v1068.test.cjs'
      - '.github/workflows/sh9-smart-trip-chatgpt-v1076-qa.yml'
  push:
    branches: [main]
    paths:
      - 'sh9/smart-travel/public-transport/smart-trip/**'
      - '.github/workflows/sh9-smart-trip-chatgpt-v1076-qa.yml'
permissions:
  contents: read
jobs:
  chatgpt-and-google-selection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax, local tests and regressions
        run: |
          node --check sh9/smart-travel/public-transport/smart-trip/smart-trip-ai-v1022.js
          node --check sh9/smart-travel/public-transport/smart-trip/smart-trip-chatgpt-handoff-v1076.js
          node --test healthhub/tests/sh9-smart-trip-chatgpt-default-v1076.test.cjs
          node --test healthhub/tests/sh9-smart-trip-auto-fallback-v1075.test.cjs
          node --test healthhub/tests/sh9-smart-trip-multimodal-v1073.test.cjs
          node --test healthhub/tests/sh9-smart-trip-results-v1072.test.cjs
          node --test healthhub/tests/guardian-smart-places-v1068.test.cjs
