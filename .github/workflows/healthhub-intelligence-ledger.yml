name: HealthHub Intelligence · Observation Ledger

on:
  pull_request:
    paths:
      - "healthhub/live-v389-ledger.js"
      - "healthhub/live-v388-intelligence.js"
      - "healthhub/live-v331.js"
      - "healthhub/tests/intelligence-ledger-v389.test.cjs"
      - "healthhub/tests/intelligence-v388.test.cjs"
      - ".github/workflows/healthhub-intelligence-ledger.yml"
  push:
    branches: [main]
    paths:
      - "healthhub/live-v389-ledger.js"
      - "healthhub/live-v388-intelligence.js"
      - "healthhub/live-v331.js"
      - "healthhub/tests/intelligence-ledger-v389.test.cjs"
      - ".github/workflows/healthhub-intelligence-ledger.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript and observation ledger
        run: |
          node --check healthhub/live-v389-ledger.js
          node --check healthhub/live-v388-intelligence.js
          node --check healthhub/live-v331.js
          node healthhub/tests/intelligence-ledger-v389.test.cjs
          node healthhub/tests/intelligence-v388.test.cjs
