name: SH9 Lena Native Handover Edge Preview v1102
on:
  push:
    paths:
      - 'supabase/functions/hh-lena-handover-preview/**'
      - 'healthhub/tests/sh9-lena-handover-preview-v1102.test.mjs'
      - '.github/workflows/sh9-lena-native-v1102-edge-qa.yml'
  pull_request:
    paths:
      - 'supabase/functions/hh-lena-handover-preview/**'
      - 'healthhub/tests/sh9-lena-handover-preview-v1102.test.mjs'
      - '.github/workflows/sh9-lena-native-v1102-edge-qa.yml'
permissions:
  contents: read
jobs:
  preview-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run preview auth, denial, dry-run, and idempotency tests
        run: |
          node --check supabase/functions/hh-lena-handover-preview/trip-pack-core.mjs
          node --check supabase/functions/hh-lena-handover-preview/handover-core.mjs
          node --test healthhub/tests/sh9-lena-handover-preview-v1102.test.mjs
