<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07152a">
<title>SHO · Sport Central</title>
<link rel="stylesheet" href="../shared/sh9-golden-bottom-nav-v924.css?v=924-unified">
<style>
:root{color-scheme:dark;--ink:#f3f8ff;--border:rgba(163,205,242,.27);--sport-radar-lime:#baff2f}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#030c1a;color:var(--ink);font:14px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
a,button{font:inherit}
a:focus-visible,button:focus-visible{outline:2px solid #8cc4ff;outline-offset:2px}
.sport-shell{height:calc(100dvh - 77px);width:min(100%,420px);margin:auto;padding:5px 6px 0;display:flex;flex-direction:column;gap:7px;overflow:hidden;background:#07162a}
.sport-hero{position:relative;isolation:isolate;flex:0 0 auto;width:100%;overflow:hidden;border-radius:18px 18px 0 0;border:1px solid rgba(163,205,242,.38);background:#0b2850;box-shadow:0 7px 22px rgba(0,0,0,.32)}
/* Use the artwork's intrinsic ratio: no cover crop, no opaque headline shading. */
.sport-hero-art{display:block;width:100%;height:auto;aspect-ratio:1672 / 941;object-fit:contain}
.sport-hero::after{content:none}
.sport-menu{position:absolute;z-index:1;left:0;right:0;bottom:0;display:flex;align-items:stretch;gap:0;min-height:36px;padding:0;border:0;border-top:1px solid rgba(218,235,255,.18);border-radius:0;background:rgba(7,25,52,.21);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);overflow-x:auto;scrollbar-width:none}
.sport-menu::-webkit-scrollbar{display:none}
.sport-menu > :is(button,a){flex:1 0 auto;display:flex;align-items:center;justify-content:center;white-space:nowrap;text-align:center;font-size:10px;line-height:17px;color:#f5faff;font-weight:650;padding:6px 5px;border:0;border-right:1px solid rgba(231,244,255,.23);border-radius:0;background:transparent;text-shadow:0 1px 3px rgba(0,0,0,.85);text-decoration:none;cursor:pointer;appearance:none;-webkit-tap-highlight-color:transparent}
.sport-menu > :is(button,a):last-child{font-size:15px;padding:6px 7px;border-right:0;flex:0 0 36px}
.sport-menu > :is(button,a):is(:hover,:focus,:active,:visited){text-decoration:none}
.sport-menu > .sport-accent,.sport-menu > .sport-accent:is(:link,:visited,:hover,:focus,:active){color:var(--sport-radar-lime);text-decoration:none}
.sport-frame{display:flex;position:relative;flex:1 1 auto;min-height:0;border:1px solid rgba(154,197,233,.3);border-radius:15px;overflow:hidden;background:#07111f}
.sport-frame iframe{display:block;flex:1;min-width:0;width:100%;height:100%;border:0;background:#07111f}
.sport-menu > :is(button,a).is-active{background:rgba(130,192,255,.12)}
.sport-menu > :is(button,a):active{background:rgba(130,192,255,.22)}
.sport-error{position:absolute;left:0;right:0;bottom:0;margin:0;padding:5px 9px;color:#b6c9dd;text-align:center;font-size:9px;background:rgba(7,22,42,.88);pointer-events:none}
.sport-error[data-ready="yes"]{display:none}
@media(max-width:360px){.sport-menu > :is(button,a){font-size:9px;padding:5px 3px}}
@media(min-width:700px){.sport-shell{width:min(100%,1020px)}.sport-menu > :is(button,a){font-size:12px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main class="sport-shell" aria-label="SHO Sport Central">
 <header class="sport-hero" aria-label="Sport Hero teljes kép">
  <img class="sport-hero-art" src="./SHO_Sport_hero_1672x941.webp?v=6" width="1672" height="941" alt="Sportmontázs: röplabda, kézilabda, labdarúgás, úszás, futás és küzdősport">
  <nav class="sport-menu" aria-label="Sport gyorsmenü">
   <button type="button" data-sport-nav="program" class="is-active" aria-pressed="true">Műsor</button>
   <button type="button" data-sport-nav="favorites" aria-pressed="false">Kedvencek</button>
   <button type="button" data-sport-nav="channels" aria-pressed="false">Csatornák</button>
   <button type="button" data-sport-nav="tvguide" aria-pressed="false">TV-naptár</button>
   <button type="button" data-sport-nav="cup" aria-pressed="false">Magyar Kupa</button>
   <a href="https://mecsradar.pages.dev/" class="sport-full-view sport-accent" rel="noreferrer external" aria-label="MecsRadar teljes nézet megnyitása">Teljes nézet</a>
   <button type="button" data-sport-action="refresh" title="MecsRadar frissítése" aria-label="MecsRadar frissítése">↻</button>
  </nav>
 </header>
 <section class="sport-frame" aria-label="MecsRadar teljes alkalmazás minden eredeti funkcióval">
  <iframe id="mecsradarFull" title="MecsRadar · teljes eredeti alkalmazás" src="https://mecsradar.pages.dev/?sh9Compact=7&amp;broadcastDefault=on&amp;matchCards=v2&amp;mobileViewFix=20261103&amp;tvCards=parity-v3" loading="eager" referrerpolicy="strict-origin-when-cross-origin" allow="fullscreen; clipboard-write"></iframe>
  <p class="sport-error" id="sportLoadHint">Ha a MecsRadar nem jelenik meg, érintsd meg a „Teljes nézet” gombot.</p>
 </section>
</main>
<script src="../notification-center/notification-core-v1.js?v=5-sport-schedule"></script>
<script src="../notification-center/sport-radar-bridge-v1.js?v=1"></script>
<script>
(function(){
 'use strict';
 var origin='https://mecsradar.pages.dev';
 var type='sh9:sport';
 var frame=document.getElementById('mecsradarFull'),hint=document.getElementById('sportLoadHint');
 var ready=false,pending=null;
 var params=new URLSearchParams(window.location.search);
 var deepView=params.get('sportView');
 var deepMatch=params.get('matchId');
 var wanted=(deepView==='cup'||deepView==='program')?deepView:null;
 if(!/^[A-Za-z0-9][A-Za-z0-9_-]{0,159}$/.test(deepMatch||''))deepMatch='';
 function send(command){
   if(!ready){pending=command;return;}
   frame.contentWindow.postMessage(Object.assign({type:type},command),origin);
 }
 function active(view){
   document.querySelectorAll('[data-sport-nav]').forEach(function(button){
     var selected=button.dataset.sportNav===view;
     button.classList.toggle('is-active',selected);
     button.setAttribute('aria-pressed',String(selected));
   });
 }
 window.addEventListener('message',function(event){
   if(event.origin!==origin||event.source!==frame.contentWindow)return;
   var data=event.data;
   if(!data||data.type!==type)return;
   if(data.action==='ready'){
     ready=true;
     if(pending){var command=pending;pending=null;send(command);}
     else if(wanted){send({action:'navigate',view:wanted,matchId:deepMatch||''});active(wanted);}
     send({action:'request-notifications'});
   }
   if(data.action==='notifications'){
     window.SHO_RADAR_NOTIFICATION_BRIDGE_V1?.accept(data.messages);
     return;
   }
   if(data.action==='navigated')active(data.view);
 });
 frame.addEventListener('load',function(){hint.dataset.ready='yes'});
 document.querySelectorAll('[data-sport-nav]').forEach(function(button){
   button.addEventListener('click',function(){
     active(button.dataset.sportNav);
     send({action:'navigate',view:button.dataset.sportNav});
   });
 });
 document.querySelector('[data-sport-action="refresh"]').addEventListener('click',function(){
   send({action:'refresh'});
 });
})();
</script>
<script defer src="../../healthhub/chatgpt-project-shortcut-v712.js?v=756-central-open"></script>
<script defer src="../shared/sh9-golden-bottom-nav-v924.js?v=929-sport-schedule"></script>
</body>
</html>
