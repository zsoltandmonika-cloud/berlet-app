 shell.addEventListener('touchstart',e=>{
  reset();
  if(refreshing||e.touches.length!==1||!atTop()||e.target.closest('button,input,select,textarea,[contenteditable],.dock'))return;
  const t=e.touches[0];start={id:t.identifier,x:t.clientX,y:t.clientY};
 },{passive:true});
 shell.addEventListener('touchmove',e=>{
  if(!start)return;
  if(e.touches.length!==1){reset();return}
  const t=e.touches[0];if(t.identifier!==start.id){reset();return}
  const dx=t.clientX-start.x,dy=t.clientY-start.y;
  if(!active){
   if(!atTop()||dy< -DEADZONE||(Math.abs(dx)>DEADZONE&&Math.abs(dx)>Math.max(0,dy)*.75)){reset();return}
   if(dy<DEADZONE)return;
   active=true;
  }
  if(e.cancelable)e.preventDefault();
  distance=Math.max(0,dy);show(distance>=THRESHOLD);
 },{passive:false});
 shell.addEventListener('touchend',e=>{
  if(!start)return;
  const fire=active&&distance>=THRESHOLD&&e.touches.length===0&&atTop();
  if(active)blockClickUntil=Date.now()+700;
  reset();
  if(fire&&!refreshing){
   refreshing=true;indicator.dataset.active='true';indicator.dataset.ready='true';
   arrow.textContent='↻';caption.textContent='Household frissítése…';
   refreshLifestyleOnly();
  }
 },{passive:true});
 shell.addEventListener('touchcancel',()=>{if(active)blockClickUntil=Date.now()+700;reset()},{passive:true});
 shell.addEventListener('click',e=>{if(Date.now()<blockClickUntil){e.preventDefault();e.stopImmediatePropagation()}},true);
})();
</script>
