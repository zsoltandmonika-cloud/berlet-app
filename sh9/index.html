:root{color-scheme:dark;--blue:#69c9ff;--line:#82bfff61}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050c1b;color:#f1f9ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{background:radial-gradient(ellipse 115% 42% at 50% 4%,#123c7e 0%,#06142b 59%,#050b1b 100%);}.wrap{width:min(100%,520px);margin:0 auto;padding:12px clamp(9px,3vw,16px) calc(16px + env(safe-area-inset-bottom));min-height:100dvh}.hero{position:relative;overflow:hidden;border-radius:22px;margin-bottom:8px;aspect-ratio:703 / 418;background:#041a36;box-shadow:0 13px 34px #0006,inset 0 0 0 1px #8fcfff28}.hero img{width:100%;height:100%;object-fit:cover;display:block}.hero:after{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid #8ec9ff3e;pointer-events:none}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(7px,2vw,12px)}.tile{min-width:0;cursor:pointer;appearance:none;color:inherit;border-radius:18px;border:1px solid #88caff54;background:linear-gradient(145deg,#224b7b73,#08162cde 70%);padding:6px 5px 9px;box-shadow:inset 0 1px 1px #ffffff23,0 6px 18px #0009;display:flex;flex-direction:column;align-items:center;gap:1px;transition:transform .16s,border-color .16s}.tile:active{transform:scale(.965)}.tile:focus-visible{outline:2px solid #75dcff;outline-offset:2px}.tile-inner{display:block;width:100%;aspect-ratio:1;max-height:125px;overflow:hidden;border-radius:13px;border:1px solid #a1caff36;background:linear-gradient(155deg,#18335b,#030914);box-shadow:0 0 13px #4baeff21,inset 0 1px 6px #c4ddff1c}.tile-inner img{width:100%;height:100%;object-fit:fill;display:block}.tile strong{font-size:clamp(13px,3.6vw,17px);line-height:1.17;margin-top:3px;letter-spacing:.01em}.tile .mod-name{font-size:clamp(9px,2.4vw,12px);line-height:1.2;white-space:nowrap;color:#cee7ff}.nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-top:12px;padding:8px 4px;border-radius:23px;background:linear-gradient(130deg,#163764e6,#08142de8);border:1px solid #9ccaff61;box-shadow:inset 0 1px 0 #fff2,0 9px 22px #0009}.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border:0;border-radius:16px;background:transparent;color:#d4e4f3;font-size:clamp(9px,2.3vw,11px);cursor:pointer}.nav button.active{background:linear-gradient(140deg,#085cb5ba,#082650de);color:white;box-shadow:inset 0 0 0 1px #48b9ff7d,0 0 13px #187cf638}.nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.modal{position:fixed;inset:0;background:#000b;backdrop-filter:blur(9px);display:none;z-index:5;align-items:center;justify-content:center;padding:20px}.modal.on{display:flex}.dialog{max-width:350px;width:100%;padding:26px 20px;text-align:center;border-radius:23px;background:linear-gradient(135deg,#18385d,#07182e);border:1px solid #a4d3ff7a;box-shadow:0 14px 55px #000d}.dialog h2{margin:0 0 12px}.dialog p{line-height:1.5;color:#cfe4f7;font-size:14px}.dialog button{margin-top:12px;padding:11px 27px;background:#2269a2;border:1px solid #a3d7ff80;border-radius:13px;color:#fff;font:inherit;cursor:pointer}.disclaimer{color:#7493b8;text-align:center;font-size:10px;margin-top:9px}@media(min-width:520px){.tile-inner{max-height:145px}.tile{padding:8px 8px 12px}.hero{margin-bottom:12px}}@media(max-width:370px){.tile{padding:4px 3px 7px;border-radius:14px}.tile-inner{border-radius:10px}.hero{border-radius:15px}.grid{gap:6px}.nav{margin-top:8px}}
