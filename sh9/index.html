:root{--hhpg-border:rgba(165,210,250,.3);--hhpg-ink:#eff8ff;--hhpg-accent:#60a5fa}
body{background:#0b1425}
.wrap{background:#0b1425;gap:7px}
/* Preserve SH9 approved Buddy hero and the three live info cells. */
.wrap .grid{
  box-sizing:border-box;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  grid-template-rows:repeat(3,minmax(0,1fr));flex:1 1 auto;min-height:0;
  gap:6px;width:100%;margin:0!important;padding:10px 8px 9px;
  border:1px solid rgba(169,209,255,.18);border-radius:20px 20px 0 0;
  background:linear-gradient(145deg,rgba(29,58,96,.74),rgba(16,30,53,.93) 53%,rgba(44,33,71,.8));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.13),0 -4px 34px rgba(5,15,33,.2);
}
.wrap .grid>.tile{
  position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;min-height:0;width:100%;height:100%;aspect-ratio:auto;
  margin:0;padding:5px 3px!important;appearance:none;
  border-radius:17px;border:1px solid var(--hhpg-border);
  background-image:linear-gradient(144deg,rgba(95,160,231,.2),rgba(30,57,94,.4) 55%,rgba(70,43,99,.27))!important;
  background-color:transparent;background-size:auto!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.19),0 8px 20px rgba(0,9,25,.26);
  color:#eff8ff;cursor:pointer;touch-action:manipulation;
  backdrop-filter:blur(14px) saturate(145%);-webkit-backdrop-filter:blur(14px) saturate(145%);
  font-family:Inter,'Segoe UI',Roboto,sans-serif;
}
.wrap .grid>.tile::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.12),transparent 30%,rgba(255,255,255,.025) 80%);
}
.wrap .grid>.tile .tile-inner{
  position:relative;z-index:1;display:grid;place-items:center;flex:none;
  width:35px;height:35px;border-radius:12px;
  background:linear-gradient(135deg,rgba(160,226,250,.23),rgba(67,87,186,.22));
  border:1px solid rgba(198,233,255,.35);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.24),0 5px 12px rgba(2,9,31,.23);
  color:#a9f0fc;
}
.wrap .grid>.tile .tile-inner svg{display:block;width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 4px rgba(84,225,251,.24))}
.wrap .grid>.tile .mod-name{position:relative;z-index:1;font-size:11.2px;font-weight:790;line-height:1.16;text-align:center;overflow-wrap:anywhere;letter-spacing:-.02em;color:#eff8ff}
.wrap .grid>.tile:nth-child(5){
  border:1px solid rgba(242,160,222,.65);
  background-image:linear-gradient(144deg,rgba(137,90,193,.24),rgba(52,40,89,.61) 57%,rgba(181,67,147,.2))!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.17),0 7px 19px rgba(2,4,22,.27),0 0 12px rgba(224,91,181,.11);
}
.wrap .grid>.tile:nth-child(5)::after{display:none}
.wrap .grid>.tile:nth-child(5) .tile-inner{color:#f5b5e8;background:linear-gradient(135deg,rgba(240,148,217,.24),rgba(100,72,165,.22));border-color:rgba(249,193,231,.42)}
.wrap .grid>.tile:nth-child(5) .mod-name{color:#ffe1f5}
.wrap .grid>.tile:focus-visible{outline:3px solid #a1f6f1;outline-offset:2px}
.wrap .grid>.tile:nth-child(5):focus-visible{outline-color:#ffd6f3}
.wrap .grid>.tile:active{transform:translateY(1px);filter:none;background-image:linear-gradient(133deg,rgba(145,207,247,.3),rgba(33,68,110,.63))!important}
/* Exact visual language of HH Golden bottom navigation: flat dark bar, upper separator,
   no inset blue pill frame and no outer rounded card. */
.wrap .nav{
  box-sizing:border-box;position:relative;left:auto;bottom:auto;transform:none;
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));width:calc(100% + 14px);
  margin:0 -7px!important;padding:5px 4px calc(6px + env(safe-area-inset-bottom,0px));
  min-height:60px;flex:0 0 auto;gap:1px;
  border:none;border-top:1px solid rgba(140,198,243,.25);
  border-radius:0;background:rgba(15,30,54,.97);
  box-shadow:0 -7px 22px rgba(0,0,0,.25);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.wrap .nav button{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;padding:4px 0;
  border:none;border-radius:0;background:transparent;color:#b9d0e8;box-shadow:none;font-family:Inter,'Segoe UI',Roboto,sans-serif}
.wrap .nav button svg{width:22px;height:22px;color:inherit;filter:none;stroke-width:1.85}
.wrap .nav button span{font-size:10px;line-height:1.1;color:inherit}
.wrap .nav button.active{border:none;border-radius:0;background:none;color:#77baff;box-shadow:none}
.wrap .nav button.active svg{color:#4f9cf2;background:rgba(237,247,255,.96);box-sizing:content-box;padding:6px;border-radius:50%;filter:none}
@media(max-width:360px){
 .wrap .grid{gap:5px;padding-inline:6px}
 .wrap .grid>.tile{padding-inline:2px!important}
 .wrap .grid>.tile .tile-inner{width:32px;height:32px}
 .wrap .grid>.tile .tile-inner svg{width:19px;height:19px}
 .wrap .grid>.tile .mod-name{font-size:10px}
}
@media(max-height:755px){
 .wrap{height:auto;min-height:100dvh;overflow:visible;padding-bottom:64px}
 .wrap .grid{flex:none;grid-template-rows:repeat(3,minmax(91px,1fr));height:300px}
 .wrap .nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,420px);margin:0!important;z-index:15}
}
</style></head><body>

<script>
(function(){'use strict';const m=document.getElementById('modal'),c=document.getElementById('close'),msg=m.querySelector('.dialog p'),standardMessage=msg.textContent;document.querySelectorAll('[data-name],[data-nav]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.nav==='Kezdőlap')return;if(b.dataset.nav==='Vissza'){if(history.length>1){history.back();return;}document.getElementById('modal-title').textContent='Vissza';msg.textContent='Nincs előző oldal az SH9 előzményeiben.';m.classList.add('on');c.focus();return;}if(b.dataset.href){location.assign(new URL(b.dataset.href,document.baseURI).href);return;}msg.textContent=standardMessage;document.getElementById('modal-title').textContent=b.dataset.name||b.dataset.nav;m.classList.add('on');c.focus();}));function close(){m.classList.remove('on')}c.addEventListener('click',close);m.addEventListener('click',e=>{if(e.target===m)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});})();
