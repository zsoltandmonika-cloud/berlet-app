<script>(function(w,d){'use strict';
const PROFILE_KEY='hh-profile';
const qs=s=>d.querySelector(s);
const go=relative=>w.location.assign(new URL(relative,d.baseURI).href);
function profile(){try{return w.localStorage.getItem(PROFILE_KEY)==='m'?'m':'z'}catch(e){return 'z'}}
function updateProfile(){const p=profile(),b=qs('#stProfile');d.documentElement.dataset.profile=p;b.textContent=(p==='m'?'Mónika':'Zsolt')+' ⇄';b.setAttribute('aria-label','Profilváltás '+(p==='m'?'Zsolt':'Mónika')+' profiljára')}
let audio=null;
function tap(){try{if(w.localStorage.getItem('hh-nutrition-PREVIEW-sound')==='off')return;const AC=w.AudioContext||w.webkitAudioContext;if(!AC)return;audio=audio||new AC();if(audio.state==='suspended')audio.resume();const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=900;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.012,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+.075);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.085)}catch(e){}try{w.navigator.vibrate&&w.navigator.vibrate(9)}catch(e){}}
qs('#stProfile').addEventListener('click',()=>{try{w.localStorage.setItem(PROFILE_KEY,profile()==='m'?'z':'m')}catch(e){}tap();updateProfile();w.dispatchEvent(new CustomEvent('healthhub:profile-changed',{detail:{profile:profile()}}))});
updateProfile();
w.addEventListener('storage',e=>{if(e.key===PROFILE_KEY)updateProfile()});
const img=qs('#stHeroImage');img.addEventListener('error',()=>{if(!img.dataset.fallback){img.dataset.fallback='1';img.src='../assets/SH9_Official_Hero_v21.webp'}});if(img.complete&&img.naturalWidth===0)img.dispatchEvent(new Event('error'));
const modal=qs('#stModal'),title=qs('#stModalTitle'),desc=qs('#stModalText'),close=qs('#stModalClose');
const texts={'Road Travel':'Az autós útvonaltervezés, forgalom és parkolási lehetőségek még fejlesztés alatt állnak.',
'Air Travel':'A repülőjáratok és repülőtéri adatok integrációja következő fejlesztési lépés.',
'Taxi':'A taxitársaságok és rendelési szolgáltatások bekötése még előkészítés alatt áll.',
'Shared Mobility':'A közösségi autók, kerékpárok és elektromos rollerek adatkapcsolatai még előkészítés alatt állnak.',
'My Trips':'A saját utazási tervek és foglalások kezelése még fejlesztés alatt áll.'};

close.addEventListener('click',dismiss);modal.addEventListener('click',e=>{if(e.target===modal)dismiss()});d.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)dismiss()});

d.querySelectorAll('[data-name]').forEach(b=>b.addEventListener('click',()=>{
 if(b.dataset.name==='Ask Léna'){const api=w.HH_CHATGPT_PROJECT_SHORTCUT_V712;if(api&&typeof api.openProject==='function')api.openProject();else go('../../healthhub/index.html?sh9nav=admin&sh9cfg=asklena');return}
 if(b.dataset.href){go(b.dataset.href);return}
