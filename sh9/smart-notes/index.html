<!doctype html><html lang="hu"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#091628"><title>SHO Smart Notes</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#25334e,#091320 55%);color:#eef3ff;font:16px system-ui;min-height:100vh}main{max-width:540px;margin:auto;padding:18px 16px 90px}header,section,article{border:1px solid #617ba455;background:#17263b99;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 0 22px #7599e311}h1{margin:8px 0;font-size:28px}small{color:#adc1dd}button,input,textarea,select{font:inherit;color:inherit;background:#20314c;border:1px solid #617ba477;border-radius:12px;padding:12px}button{cursor:pointer}button:focus-visible{outline:2px solid #79bfff}input,textarea,select{width:100%;margin:5px 0}textarea{min-height:220px;resize:vertical}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid button{text-align:left;min-height:75px}a{color:#9dcaff}article button{width:100%;text-align:left;margin-top:6px}label{display:block;margin-top:10px}footer{position:fixed;bottom:0;left:0;right:0;background:#0c182aee;padding:14px;text-align:center;border-top:1px solid #617ba455}[hidden]{display:none!important}
</style><main><header><small>SHO · GOLDEN STANDARD · FEJLESZTÉSI VERZIÓ</small><h1>▤ Smart Notes</h1><p>Jegyzetek, ötletek, feladatok.</p><small id="cloudStatus" role="status">Kapcsolódás…</small><div class="row"><button id="login" hidden>Google-belépés</button><button id="refresh">Frissítés</button></div><div class="row"><a href="../shopping/smart-list.html">🛒 Smart Shopping List</a><strong>▤ Smart Notes</strong></div></header><section id="home"><button id="showAll" hidden>Összes jegyzet megnyitása</button><input id="search" type="search" placeholder="Keresés a jegyzetekben" aria-label="Keresés"><div id="books" class="grid"></div><div class="row"><button id="addBook">＋ Jegyzetfüzet</button><button id="addNote">＋ Jegyzet</button></div><div id="list"></div></section><section id="edit" hidden><button id="back">‹ Jegyzetek</button><label for="book">Jegyzetfüzet</label><select id="book"></select><label for="title">Cím</label><input id="title" maxlength="180"><label><input type="checkbox" id="shared" style="width:auto"> Közös jegyzet</label><label for="body">Jegyzet</label><textarea id="body" placeholder="Írd ide a jegyzetet…"></textarea><div class="row"><button id="voice" aria-pressed="false">🎙 Magyar diktálás</button><button id="voiceStop" disabled>■ Leállítás</button></div><small id="voiceStatus" role="status" aria-live="polite"></small><div class="row"><button id="bullet">• Lista</button><button id="check">☐ Teendő</button></div><p id="status" role="status"></p><div class="row"><button id="save">✓ Mentés</button><button id="archive">Archiválás</button></div><h3>Feladatintegráció</h3><label for="taskTitle">Új feladat címe</label><input id="taskTitle" maxlength="180"><label for="who">Felelős</label><select id="who"><option value="zsolt">Zsolt</option><option value="monika">Mónika</option><option value="lena">Léna</option></select><button id="createTask">＋ Feladat létrehozása és csatolása</button><small>Léna kijelölése nem indít automatikus AI-végrehajtást.</small><small>A jegyzet az eredeti helyén marad.</small><button id="prepare">Meglévő feladatok betöltése</button><select id="taskPick" aria-label="Feladat"></select><button id="attach">Jegyzet csatolása</button><pre id="preview" style="white-space:pre-wrap"></pre></section></main><footer><a href="../family-hub/">Feladatok</a> · <a href="../">SHO kezdőlap</a></footer><script src="../../healthhub/central-vault/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.2/dist/umd/supabase.min.js"></script><script src="../../healthhub/guardian/guardian-native-auth-v1063.js"></script><script>
'use strict';
const $=id=>document.getElementById(id),cfg=window.HH_CENTRAL_VAULT;
const nativeOAuth=(()=>{try{return sessionStorage.getItem('hh-one-native-oauth-v1063')==='1'}catch(_){return false}})();
const api=cfg?.enabled&&window.supabase?.createClient?window.supabase.createClient(cfg.supabaseUrl,cfg.publishableKey,{auth:{storageKey:'hh-guardian-family-auth-v785',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:nativeOAuth?'pkce':'implicit'}}):null;
let books=[],notes=[],active=null,filter=null,user=null,ready=false,busy=false,epoch=0,linkedIds=null;const rawTask=new URLSearchParams(location.search).get('task');const taskContext=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(rawTask||'')?rawTask:null;
const B='hh_smart_notebooks',N='hh_smart_notes',L='hh_smart_note_tasks';
const button=(text,fn)=>{const b=document.createElement('button');b.type='button';b.textContent=text;b.onclick=fn;return b};
const notice=t=>$('cloudStatus').textContent=t;
function result(r){if(r.error)throw r.error;return r.data}
function render(){
 $('books').replaceChildren();for(const b of books.filter(b=>!b.archived))$('books').append(button((filter===b.id?'✓ ':'▤ ')+b.title,()=>{filter=filter===b.id?null:b.id;render()}));
 $('list').replaceChildren();const q=$('search').value.toLocaleLowerCase('hu-HU');
 for(const n of notes.filter(n=>!n.archived&&(!linkedIds||linkedIds.has(n.id))&&(!filter||n.notebook_id===filter)&&(n.title+' '+n.body).toLocaleLowerCase('hu-HU').includes(q))){const a=document.createElement('article');a.append(button(n.title,()=>open(n)));$('list').append(a)}
 $('addBook').disabled=!ready||busy;$('addNote').disabled=!ready||busy||!books.some(b=>!b.archived);
}
async function load(){const id=user?.id,seq=epoch;const [b,n,l]=await Promise.all([api.from(B).select('*').order('title'),api.from(N).select('*').order('title'),taskContext?api.from(L).select('note_id').eq('task_id',taskContext):Promise.resolve({data:[]})]);if(seq!==epoch||id!==user?.id)return false;books=result(b);notes=result(n);linkedIds=taskContext?new Set(result(l).map(x=>x.note_id)):null;$('showAll').hidden=!taskContext;ready=true;render();notice(taskContext?'A feladathoz csatolt jegyzetek.':'Felhőkapcsolat rendben.');return true}
function clear(){epoch++;if(channel&&api){void api.removeChannel(channel);channel=null}clearTimeout(autoTimer);clearTimeout(refreshTimer);if(recognition)recognition.abort();linkedIds=null;user=null;ready=false;books=[];notes=[];active=null;filter=null;$('title').value='';$('body').value='';$('preview').textContent='';$('taskPick').replaceChildren();$('edit').hidden=true;$('home').hidden=false;render()}
async function init(){clear();$('login').hidden=true;if(!api){notice('A felhőkapcsolat nem érhető el.');return}const seq=epoch;try{const auth=await api.auth.getUser();if(seq!==epoch)return;if(auth.error||!auth.data?.user){$('login').hidden=false;notice('Bejelentkezés szükséges.');return}user=auth.data.user;const acl=result(await api.from('hh_profile_access').select('profile_key').eq('user_id',user.id));if(seq!==epoch)return;if(!acl.some(a=>['zsolt','monika'].includes(a.profile_key)))throw Error('Nincs családi hozzáférés.');if(await load()){subscribeNotes();if(new URLSearchParams(location.search).get('new')==='1'&&books.length)open()}}catch(e){if(seq===epoch){ready=false;render();notice('Smart Notes még nem elérhető: '+e.message)}}}
let pendingTask=null,autoTimer=null,refreshTimer=null,channel=null;function open(n){pendingTask=null;if(!ready||busy)return;active=n?{...n}:{id:crypto.randomUUID(),title:'',body:'',notebook_id:filter||books.find(b=>!b.archived)?.id,shared:false,revision:0,isNew:true};$('book').replaceChildren(...books.filter(b=>!b.archived||b.id===active.notebook_id).map(b=>new Option(b.title,b.id)));$('book').value=active.notebook_id;$('title').value=active.title;$('taskTitle').value=active.title;$('body').value=active.body;$('shared').checked=active.shared;$('preview').textContent='';$('status').textContent='';$('taskPick').replaceChildren();const edit=active.isNew||active.owner_id===user.id;for(const id of ['book','title','body','shared','save','archive','voice','bullet','check'])$(id).disabled=!edit;$('home').hidden=true;$('edit').hidden=false}
async function save(archive=false){if(!ready||busy||!active||(!active.isNew&&active.owner_id!==user?.id))return false;const title=$('title').value.trim();if(!title){$('status').textContent='Adj címet a jegyzetnek.';return false}const a=active,seq=epoch;const body=$('body').value;const payload={title,body,notebook_id:$('book').value,shared:$('shared').checked,archived:archive||!!a.archived};if(payload.shared&&!books.find(b=>b.id===payload.notebook_id)?.shared){$('status').textContent='Közös jegyzethez közös jegyzetfüzet szükséges.';return false}busy=true;$('save').disabled=true;try{let query=a.isNew?api.from(N).insert({...payload,id:a.id,owner_id:user.id}):api.from(N).update({...payload,revision:Number(a.revision)+1}).eq('id',a.id).eq('revision',a.revision);const data=result(await query.select().single());if(seq!==epoch||active!==a)return false;Object.assign(a,data,{isNew:false});const index=notes.findIndex(n=>n.id===a.id);if(index<0)notes.push({...data});else notes[index]=data;$('status').textContent='Mentve a felhőbe.';return true}catch(e){if(seq===epoch)$('status').textContent='Nem mentve: '+e.message+' (ütközés esetén nyisd meg újra a jegyzetet).';return false}finally{busy=false;if(seq===epoch)$('save').disabled=false}}
$('addBook').onclick=async()=>{if(!ready||busy)return;const title=prompt('Jegyzetfüzet neve')?.trim();if(!title)return;const shared=confirm('Közös családi jegyzetfüzet legyen?');const seq=epoch;busy=true;render();try{const b=result(await api.from(B).insert({title,shared,owner_id:user.id}).select().single());if(seq!==epoch)return;books.push(b);filter=b.id;notice('Jegyzetfüzet mentve.')}catch(e){if(seq===epoch)notice('Nem mentve: '+e.message)}finally{busy=false;render()}};
$('addNote').onclick=()=>open();$('search').oninput=render;$('save').onclick=()=>save();$('back').onclick=()=>{if(busy)return;if(active&&($('title').value!==active.title||$('body').value!==active.body||$('book').value!==active.notebook_id||$('shared').checked!==active.shared)&&!confirm('Mentetlen változások elvetése?'))return;$('edit').hidden=true;$('home').hidden=false;active=null;render();refreshIfIdle()};$('archive').onclick=async()=>{if(confirm('Archiválod ezt a jegyzetet?')&&await save(true))$('back').click()};for(const [id,t] of [['bullet','• '],['check','☐ ']])$(id).onclick=()=>{const a=$('body');a.setRangeText(t,a.selectionStart,a.selectionEnd,'end');a.focus();scheduleSave()};
$('prepare').onclick=async()=>{if(!ready||busy)return;try{const tasks=result(await api.from('hh_family_tasks').select('id,title,status').in('status',['todo','progress']).order('created_at',{ascending:false}).limit(100));$('taskPick').replaceChildren(new Option('Válassz meglévő feladatot',''),...tasks.map(t=>new Option(t.title,t.id)));if(taskContext)$('taskPick').value=taskContext;$('preview').textContent='Közös jegyzet csatolható a kiválasztott feladathoz.'}catch(e){$('preview').textContent=e.message}};
$('attach').onclick=async()=>{if(!ready||busy||!active)return;const id=$('taskPick').value;if(!id){$('preview').textContent='Válassz feladatot.';return}if(active.isNew||!active.shared||!$('shared').checked){$('preview').textContent='Először mentsd közösként a jegyzetet.';return}const seq=epoch;busy=true;try{result(await api.from(L).insert({note_id:active.id,task_id:id,owner_id:user.id}));if(seq===epoch){if(taskContext===id)linkedIds?.add(active.id);$('preview').textContent='Jegyzet csatolva a meglévő feladathoz.'}}catch(e){if(seq===epoch)$('preview').textContent='Nem sikerült csatolni: '+e.message}finally{busy=false}};
$('login').onclick=async()=>{const r=await api.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname+location.search}});if(r.error)notice(r.error.message)};
$('showAll').onclick=()=>location.assign(location.pathname);$('refresh').onclick=()=>{if(busy||!user||!$('edit').hidden)return;load().catch(e=>notice(e.message))};
if(api)api.auth.onAuthStateChange(event=>{if(event==='SIGNED_OUT'){clear();notice('Kijelentkezve.');$('login').hidden=false}else if(event==='SIGNED_IN'&&!user)setTimeout(init,0)});render();
let recognition=null,voiceTarget=null,voicePos=0;const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;const voiceStatus=t=>$('voiceStatus').textContent=t;function stopVoice(){if(recognition)recognition.stop()}$('voice').onclick=()=>{if(recognition)return;if(!Speech){voiceStatus('A böngésző nem támogatja a diktálást. Használd a telefon billentyűzetének mikrofonját.');return}const rec=new Speech();recognition=rec;voiceTarget=active;voicePos=$('body').selectionEnd;rec.lang='hu-HU';rec.continuous=true;rec.interimResults=true;rec.onstart=()=>{$('voice').setAttribute('aria-pressed','true');$('voiceStop').disabled=false;voiceStatus('Hallgatlak…')};rec.onresult=e=>{if(active!==voiceTarget||$('edit').hidden)return;let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal){const a=$('body'),prefix=voicePos>0&&!/\s/.test(a.value[voicePos-1])?' ':'';const insert=prefix+t.trim()+' ';a.setRangeText(insert,voicePos,voicePos,'end');voicePos+=insert.length;scheduleSave()}else interim+=t}voiceStatus(interim||'Hallgatlak…')};rec.onerror=e=>voiceStatus('Diktálási hiba: '+e.error+'. A már beírt szöveg megmarad.');rec.onend=()=>{recognition=null;$('voice').setAttribute('aria-pressed','false');$('voiceStop').disabled=true;if(!$('voiceStatus').textContent.startsWith('Diktálási hiba'))voiceStatus('Diktálás befejezve.')};try{rec.start()}catch(e){recognition=null;voiceStatus('A mikrofon nem indítható.')}};$('voiceStop').onclick=stopVoice;$('back').addEventListener('click',stopVoice);$('body').addEventListener('input',()=>{if(recognition)stopVoice()});function isDirty(){return active&&($('title').value.trim()!==active.title||$('body').value!==active.body||$('book').value!==active.notebook_id||$('shared').checked!==active.shared)}
function scheduleSave(){clearTimeout(autoTimer);if(!active||!isDirty()||!$('title').value.trim()||(!active.isNew&&active.owner_id!==user?.id))return;autoTimer=setTimeout(()=>{if(busy){scheduleSave();return}if(isDirty())void save()},1200)}
for(const id of ['title','body','book','shared'])$(id).addEventListener('input',scheduleSave);
$('createTask').onclick=async()=>{if(!ready||busy||!active)return;const title=$('taskTitle').value.trim(),assignee=$('who').value;if(!title){$('preview').textContent='Adj címet a feladatnak.';return}if(active.isNew||isDirty()||!active.shared){$('preview').textContent='Először mentsd el a közös jegyzetet.';return}const a=active,seq=epoch,creator=localStorage.getItem('hh-profile')==='m'?'monika':'zsolt';const key=JSON.stringify([a.id,title,creator,assignee]);if(pendingTask&&pendingTask.key!==key){$('preview').textContent='Az előző feladat mentését ellenőrizni kell. Ne hozz létre másikat.';return}if(!pendingTask){if(!confirm('Létrehozod és kiosztod a feladatot?'))return;pendingTask={key,id:crypto.randomUUID()}}busy=true;$('createTask').disabled=true;try{const existing=result(await api.from(L).select('task_id').eq('note_id',a.id).eq('task_id',pendingTask.id).maybeSingle());const id=existing?.task_id||result(await api.rpc('hh_smart_note_create_task',{p_note_id:a.id,p_task_id:pendingTask.id,p_title:title,p_creator:creator,p_assignee:assignee}));if(seq!==epoch||a!==active)return;pendingTask=null;const link=document.createElement('a');link.href='../family-hub/?task='+encodeURIComponent(id);link.textContent='Feladat létrehozva – megnyitás';$('preview').replaceChildren(link)}catch(e){if(seq===epoch)$('preview').textContent='Mentés nem igazolt: '+e.message+'. Ugyanazzal a címmel és felelőssel ismételhető.'}finally{busy=false;$('createTask').disabled=false}};
function subscribeNotes(){if(channel||!user)return;channel=api.channel('smart-notes-'+user.id);for(const table of [B,N,L])channel.on('postgres_changes',{event:'*',schema:'public',table},()=>{if(!$('edit').hidden){notice('Másik eszközön változás történt; mentéskor verzióellenőrzés történik.');return}refreshIfIdle()});channel.subscribe(status=>{if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')notice('Élő kapcsolat nem elérhető; visszatéréskor frissítünk.')})}
function refreshIfIdle(){if(!ready||busy||!user||!$('edit').hidden||!navigator.onLine)return;clearTimeout(refreshTimer);refreshTimer=setTimeout(()=>{if(ready&&!busy&&user&&$('edit').hidden)load().catch(e=>notice('Frissítés nem sikerült: '+e.message))},350)}
window.addEventListener('online',refreshIfIdle);window.addEventListener('focus',refreshIfIdle);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshIfIdle()});
window.addEventListener('beforeunload',e=>{if(isDirty()){e.preventDefault();e.returnValue=''}});
window.addEventListener('pagehide',stopVoice);void init();</script></html>
