<!doctype html><html lang="hu"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#091628"><title>SHO Smart Notes</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#25334e,#091320 55%);color:#eef3ff;font:16px system-ui;min-height:100vh}main{max-width:540px;margin:auto;padding:18px 16px 90px}header,section,article{border:1px solid #617ba455;background:#17263b99;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 0 22px #7599e311}h1{margin:8px 0;font-size:28px}small{color:#adc1dd}button,input,textarea,select{font:inherit;color:inherit;background:#20314c;border:1px solid #617ba477;border-radius:12px;padding:12px}button{cursor:pointer}button:focus-visible{outline:2px solid #79bfff}input,textarea,select{width:100%;margin:5px 0}textarea{min-height:220px;resize:vertical}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid button{text-align:left;min-height:75px}a{color:#9dcaff}article button{width:100%;text-align:left;margin-top:6px}label{display:block;margin-top:10px}footer{position:fixed;bottom:0;left:0;right:0;background:#0c182aee;padding:14px;text-align:center;border-top:1px solid #617ba455}[hidden]{display:none!important}
</style><main><header><small>SHO · GOLDEN STANDARD · DEMÓ</small><h1>▤ Smart Notes</h1><p>Jegyzetek, ötletek, feladatok.</p><small>Izolált felületi próba. Nincs éles mentés, feladatkiosztás vagy szinkronizáció. Ne adj meg személyes adatot.</small></header><section id="home"><input id="search" type="search" placeholder="Keresés a jegyzetekben" aria-label="Keresés"><div id="books" class="grid"></div><div class="row"><button id="addBook">＋ Jegyzetfüzet</button><button id="addNote">＋ Jegyzet</button></div><div id="list"></div></section><section id="edit" hidden><button id="back">‹ Jegyzetek</button><label for="book">Jegyzetfüzet</label><select id="book"></select><label for="title">Cím</label><input id="title" maxlength="180"><label for="body">Jegyzet</label><textarea id="body" placeholder="Írd ide a jegyzetet…"></textarea><div class="row"><button id="voice" aria-pressed="false">🎙 Magyar diktálás</button><button id="voiceStop" disabled>■ Leállítás</button></div><small id="voiceStatus" role="status" aria-live="polite"></small><div class="row"><button id="bullet">• Lista</button><button id="check">☐ Teendő</button></div><p id="status" role="status"></p><div class="row"><button id="save">✓ Mentés a demóban</button><button id="archive">Archiválás</button></div><h3>Feladatintegráció</h3><small>A feladat-előkészítés az eredeti jegyzetet nem módosítja.</small><select id="who" aria-label="Felelős"><option>Zsolt</option><option>Mónika</option><option>Léna</option></select><button id="prepare">Feladat előkészítése</button><pre id="preview" style="white-space:pre-wrap"></pre></section></main><footer><a href="../family-hub/">Feladatok</a> · <a href="../">SHO kezdőlap</a></footer><script>
'use strict';const $=id=>document.getElementById(id);let books=['SHO Deficit List','Bug List','Fejlesztési javaslatok','Általános'],notes=[],active=null,filter=null;const button=(text,fn)=>{const b=document.createElement('button');b.textContent=text;b.onclick=fn;return b};function render(){ $('books').replaceChildren();for(const b of books)$('books').append(button((filter===b?'✓ ':'▤ ')+b,()=>{filter=filter===b?null:b;render()}));$('list').replaceChildren();const q=$('search').value.toLowerCase();for(const n of notes.filter(n=>!n.archived&&(!filter||n.book===filter)&&(n.title+' '+n.body).toLowerCase().includes(q))){const a=document.createElement('article');a.append(button(n.title,()=>open(n)));$('list').append(a)}}
function open(n){active=n||{id:crypto.randomUUID(),title:'',body:'',book:filter||books[0]};$('book').replaceChildren(...books.map(b=>new Option(b,b)));$('book').value=active.book;$('title').value=active.title;$('body').value=active.body;$('preview').textContent='';$('status').textContent='';$('home').hidden=true;$('edit').hidden=false}
function save(){if(!$('title').value.trim()){$('status').textContent='Adj címet a jegyzetnek.';return false}Object.assign(active,{title:$('title').value.trim(),body:$('body').value,book:$('book').value});if(!notes.includes(active))notes.push(active);$('status').textContent='Mentve az aktuális demó-munkamenetben.';return true}
$('addBook').onclick=()=>{const n=prompt('Jegyzetfüzet neve')?.trim();if(n&&!books.includes(n)){books.push(n);filter=n;render()}};$('addNote').onclick=()=>open();$('search').oninput=render;$('save').onclick=save;$('back').onclick=()=>{if(($('title').value!==active.title||$('body').value!==active.body||$('book').value!==active.book)&&!confirm('Mentetlen változások elvetése?'))return;$('edit').hidden=true;$('home').hidden=false;render()};$('archive').onclick=()=>{if(confirm('Archiválod ezt a jegyzetet?')&&save()){active.archived=true;$('back').click()}};for(const [id,t] of [['bullet','• '],['check','☐ ']])$(id).onclick=()=>{const a=$('body');a.setRangeText(t,a.selectionStart,a.selectionEnd,'end');a.focus()};$('prepare').onclick=()=>{if(!save())return;const a=$('body');$('preview').textContent='ELŐNÉZET – nincs kiosztva\n'+active.title+'\nFelelős: '+$('who').value+'\n'+(a.value.slice(a.selectionStart,a.selectionEnd)||a.value)};render();
let recognition=null,voiceTarget=null,voicePos=0;const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;const voiceStatus=t=>$('voiceStatus').textContent=t;function stopVoice(){if(recognition)recognition.stop()}$('voice').onclick=()=>{if(recognition)return;if(!Speech){voiceStatus('A böngésző nem támogatja a diktálást. Használd a telefon billentyűzetének mikrofonját.');return}const rec=new Speech();recognition=rec;voiceTarget=active;voicePos=$('body').selectionEnd;rec.lang='hu-HU';rec.continuous=true;rec.interimResults=true;rec.onstart=()=>{$('voice').setAttribute('aria-pressed','true');$('voiceStop').disabled=false;voiceStatus('Hallgatlak…')};rec.onresult=e=>{if(active!==voiceTarget||$('edit').hidden)return;let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal){const a=$('body'),prefix=voicePos>0&&!/\\s/.test(a.value[voicePos-1])?' ':'';const insert=prefix+t.trim()+' ';a.setRangeText(insert,voicePos,voicePos,'end');voicePos+=insert.length}else interim+=t}voiceStatus(interim||'Hallgatlak…')};rec.onerror=e=>voiceStatus('Diktálási hiba: '+e.error+'. A már beírt szöveg megmarad.');rec.onend=()=>{recognition=null;$('voice').setAttribute('aria-pressed','false');$('voiceStop').disabled=true;if(!$('voiceStatus').textContent.startsWith('Diktálási hiba'))voiceStatus('Diktálás befejezve.')};try{rec.start()}catch(e){recognition=null;voiceStatus('A mikrofon nem indítható.')}};$('voiceStop').onclick=stopVoice;$('back').addEventListener('click',stopVoice);$('body').addEventListener('input',()=>{if(recognition)stopVoice()});window.addEventListener('pagehide',stopVoice);</script></html>
